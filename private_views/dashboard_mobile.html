<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>M2T - Dashboard</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M2T">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="stylesheet" href="/dist/output.css">
<link rel="stylesheet" href="/mobile.css">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        .mob-tag-scroll::-webkit-scrollbar { display: none; }
    </style>
    <script src="/theme.js"></script>
    <script src="/transaction_modal.js"></script>
    <script src="/mobile_transactions.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <script src="/auth.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.ftAuth) ftAuth.initAuthGuard();
        });
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex mobile-view-active">
<div id="mobile-ui">
  <!-- ── Mobile Header ── -->
  <div class="mob-header">
    <div class="mob-header-logo-container">
      <div class="mob-header-logo-circle">
        <span class="material-symbols-outlined">insights</span>
      </div>
      <div class="mob-header-logo-text">M2T</div>
    </div>
    <div style="flex:1"></div>
    <div class="mob-header-market-pill">
      <div class="mob-market-item"><span>EU</span><span id="mob-dot-eu" class="mob-market-dot"></span></div>
      <div class="mob-market-item"><span>US</span><span id="mob-dot-us" class="mob-market-dot"></span></div>
    </div>
    <div id="mob-header-var-day" class="mob-header-var-pill">--</div>
    <div class="mob-header-actions">
      <a href="/notifications" class="mob-icon-btn relative"><span class="material-symbols-outlined">notifications</span><span id="mob-notification-badge" class="mob-badge" style="display: none;">0</span></a>
      <a id="mobile-admin-link" href="/admin" class="mob-icon-btn" style="display: none;"><span class="material-symbols-outlined">admin_panel_settings</span></a>
      <a href="/settings" class="mob-icon-btn"><span class="material-symbols-outlined">settings</span></a>
    </div>
  </div>

  <div class="mob-scroll" id="mob-dashboard-scroll">
    <!-- Hero Card -->
    <div class="mob-hero">
      <div class="mob-hero-label">Patrimonio</div>
      <div class="flex items-baseline gap-2 mb-4">
        <div class="mob-hero-value" id="mob-total-net" style="font-size: 28px;">€ 0</div>
        <div class="text-[14px] font-bold text-slate-500 opacity-80" id="mob-total-gross">(€ 0)</div>
        <div id="mob-day-var" class="ml-auto px-2 py-0.5 rounded-lg text-[10px] font-black shadow-sm hidden"></div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div class="mob-hero-stat-item !p-0 !bg-transparent">
          <span class="mob-hero-stat-label">Migliori (1D)</span>
          <div id="mob-top-winners" class="space-y-4 mt-2">--</div>
        </div>
        <div class="mob-hero-stat-item !p-0 !bg-transparent">
          <span class="mob-hero-stat-label">Peggiori (1D)</span>
          <div id="mob-top-losers" class="space-y-4 mt-2">--</div>
        </div>
      </div>
    </div>
    
    <!-- Portfolio Filters -->
    <div class="px-4 pb-4 overflow-x-auto no-scrollbar flex gap-2 mt-2 mob-tag-scroll" id="mob-portfolio-filters">
        <!-- Filled by JS -->
    </div>

    <!-- Chart -->
    <div class="mob-chart-card">
      <div class="flex items-baseline gap-2 mb-3">
        <div class="mob-chart-title">Performance</div>
        <div class="mob-chart-subtitle">Aggregato</div>
      </div>
      <div class="mob-chart-range-bar" id="mob-range-bar">
        <div class="mob-range-btn" onclick="mobSetRange('1W')" data-range="1W">1W</div>
        <div class="mob-range-btn active" onclick="mobSetRange('1M')" data-range="1M">1M</div>
        <div class="mob-range-btn" onclick="mobSetRange('3M')" data-range="3M">3M</div>
        <div class="mob-range-btn" onclick="mobSetRange('YTD')" data-range="YTD">YTD</div>
        <div class="mob-range-btn" onclick="mobSetRange('1Y')" data-range="1Y">1Y</div>
        <div class="mob-range-btn" onclick="mobSetRange('ALL')" data-range="ALL">ALL</div>
      </div>
      <div class="mob-chart-canvas-wrapper mt-2">
        <canvas id="mob-perf-chart"></canvas>
      </div>
    </div>

    <!-- Portfolio List -->
    <div class="mob-section-header">
      <span class="mob-section-title">Portafogli</span>
      <div class="flex gap-4">
        <span class="mob-section-link text-emerald-500" onclick="openTransactionModal()">+ Trans</span>
        <span class="mob-section-link" onclick="openPortfolioModal()">+ Nuovo</span>
      </div>
    </div>
    <div class="mob-portfolio-list" id="mob-portfolio-list"></div>

    <!-- Footer -->
    <div class="px-8 py-8 flex flex-col items-center opacity-30">
      <div class="text-[9px] font-black uppercase tracking-widest text-slate-500" id="mob-app-version">v. 2.0</div>
    </div>
  </div>

  <!-- Portfolio Modal -->
  <div id="portfolio-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[10000] flex items-center justify-center p-4" style="display:none">
      <div class="bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md overflow-hidden flex flex-col shadow-2xl">
          <div class="px-5 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
              <h3 id="portfolio-modal-title" class="font-bold">Nuovo Portafoglio</h3>
              <button onclick="closePortfolioModal()"><span class="material-symbols-outlined">close</span></button>
          </div>
          <form id="portfolio-form" class="p-5 space-y-3 overflow-y-auto custom-scrollbar">
              <input type="hidden" id="p-id"/>
              <div class="space-y-1">
                  <label class="text-xs font-bold text-slate-400 uppercase">Nome</label>
                  <input id="p-name" required class="w-full bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-800 rounded-lg py-2 px-3"/>
              </div>
              <div class="space-y-1">
                  <label class="text-xs font-bold text-slate-400 uppercase">Tipo</label>
                  <select id="p-type" class="w-full bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-800 rounded-lg py-2 px-3">
                      <option value="Investimento">Investimento</option>
                      <option value="Conto Deposito">Conto Deposito</option>
                  </select>
              </div>
              <div class="grid grid-cols-2 gap-3">
                  <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-400 uppercase">Valuta</label>
                    <select id="p-currency" class="w-full bg-slate-50 dark:bg-slate-900 rounded-lg py-2 px-3"><option value="EUR">EUR</option><option value="USD">USD</option></select>
                  </div>
                  <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-400 uppercase">Colore</label>
                    <input id="p-color" type="color" class="w-full h-[40px] bg-slate-50 dark:bg-slate-900 rounded-lg py-1 px-1" value="#6366f1"/>
                  </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                  <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-400 uppercase">Data</label>
                    <input id="p-date" type="date" required class="w-full bg-slate-50 dark:bg-slate-900 rounded-lg py-2 px-3"/>
                  </div>
                  <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-400 uppercase">Cash</label>
                    <input id="p-cash" type="number" step="any" required class="w-full bg-slate-50 dark:bg-slate-900 rounded-lg py-2 px-3"/>
                  </div>
              </div>
              <div class="pt-4 flex gap-3">
                  <button type="button" onclick="closePortfolioModal()" class="flex-1 py-2 rounded-lg font-bold text-slate-500">Annulla</button>
                  <button type="submit" class="flex-1 py-2 bg-primary text-white rounded-lg font-bold shadow-lg shadow-primary/20">Salva</button>
              </div>
          </form>
      </div>
  </div>

  <!-- Bottom Nav -->
  <div class="mob-tab-bar">
    <a href="/dashboard" class="mob-tab-item active"><span class="material-symbols-outlined">dashboard</span></a>
    <a href="/market" class="mob-tab-item"><span class="material-symbols-outlined">trending_up</span></a>
    <a href="/watchlist" class="mob-tab-item"><span class="material-symbols-outlined">visibility</span></a>
    <a href="/history" class="mob-tab-item"><span class="material-symbols-outlined">history</span></a>
    <a href="/dividend" class="mob-tab-item"><span class="material-symbols-outlined">payments</span></a>
    <a href="/reports" class="mob-tab-item"><span class="material-symbols-outlined">pie_chart</span></a>
  </div>
</div>

<script>
  let mobPerfChart = null;
  let mobCurrentRange = '1M';
  let selectedPortfolioIds = JSON.parse(localStorage.getItem('selectedPortfolioIds') || '[]');

  function mobRenderPortfolioFilters() {
      const container = document.getElementById('mob-portfolio-filters');
      if (!container || !window._dashboardData) return;
      const portfolios = window._dashboardData.portfolios || [];
      container.innerHTML = portfolios.map(p => {
          const isSelected = selectedPortfolioIds.includes(p.id);
          const style = isSelected 
              ? `background-color: ${p.color || 'var(--primary)'}; color: white; border-color: ${p.color || 'var(--primary)'};` 
              : `background-color: rgba(255,255,255,0.05); color: #94a3b8; border-color: rgba(255,255,255,0.1);`;
          return `<button onclick="mobTogglePortfolioFilter(${p.id})" style="${style}" class="px-4 py-1.5 rounded-full text-[10px] font-bold transition-all shrink-0 border">${p.name}</button>`;
      }).join('') || '<span class="text-[10px] text-slate-400 italic px-2">Nessun portafoglio.</span>';
  }

  window.mobTogglePortfolioFilter = function(pId) {
      if (selectedPortfolioIds.includes(pId)) {
          selectedPortfolioIds = selectedPortfolioIds.filter(id => id !== pId);
      } else {
          selectedPortfolioIds.push(pId);
      }
      localStorage.setItem('selectedPortfolioIds', JSON.stringify(selectedPortfolioIds));
      mobRenderPortfolioFilters();
      mobUpdateDashboard(window._dashboardData);
      mobUpdateChart();
  }

  async function mobUpdateDashboard(prefetchedData = null) {
      try {
          const data = prefetchedData || await (await fetch('/api/portfolios')).json();
          window._dashboardData = data;
          const portfolios = data.portfolios || [];
          
          let filtered = portfolios;
          if (selectedPortfolioIds.length > 0) {
              filtered = portfolios.filter(p => selectedPortfolioIds.includes(p.id));
          }

          const metrics = {
              net: filtered.reduce((sum, p) => sum + (parseFloat(p.netValue) || 0), 0),
              gross: filtered.reduce((sum, p) => sum + (parseFloat(p.totalValue) || 0), 0),
              change: filtered.reduce((sum, p) => sum + (parseFloat(p.changeValue) || 0), 0)
          };

          document.getElementById('mob-total-net').innerText = formatPrivacy(metrics.net, 'EUR', 'mob-net');
          document.getElementById('mob-total-gross').innerText = `(${formatPrivacy(metrics.gross, 'EUR', 'mob-gross')})`;
          
          const varEl = document.getElementById('mob-day-var');
          if (varEl) {
              const isPos = metrics.change >= 0;
              varEl.className = `ml-auto px-2 py-0.5 rounded-lg text-[10px] font-black shadow-sm ${isPos ? 'bg-emerald-500/10 text-emerald-500' : 'bg-rose-500/10 text-rose-500'}`;
              varEl.innerText = (isPos ? '+' : '') + formatPrivacy(metrics.change, 'EUR', 'mob-var');
              varEl.classList.remove('hidden');
          }

          const pList = document.getElementById('mob-portfolio-list');
          if (pList) {
              pList.innerHTML = portfolios.map(p => `
                  <div class="p-4 bg-white dark:bg-surface-dark border-b border-slate-100 dark:border-slate-800 flex items-center justify-between" onclick="window.location.href='/portfolio?id=${p.id}'">
                      <div class="flex items-center gap-3">
                          <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white" style="background-color:${p.color || '#6366f1'}">
                              <span class="material-symbols-outlined">work</span>
                          </div>
                          <div>
                              <div class="text-[14px] font-black">${p.name}</div>
                              <div class="text-[10px] text-slate-500 uppercase font-bold">${p.assetCount || 0} Assets</div>
                          </div>
                      </div>
                      <div class="text-right">
                          <div class="text-[14px] font-black">${formatPrivacy(p.totalValue, p.currency, 'p-mob-'+p.id)}</div>
                          <div class="text-[11px] font-bold ${p.changeValue >= 0 ? 'text-emerald-500' : 'text-rose-500'}">${p.changeValue >= 0 ? '+' : ''}${formatPrivacy(p.changeValue, p.currency, 'dv-mob-'+p.id)}</div>
                      </div>
                  </div>
              `).join('');
          }
          mobRenderPortfolioFilters();
          mobUpdateWinnersLosers(data.global);
          mobSyncMarketStatus();
      } catch(e) { console.error(e); }
  }

  function mobUpdateWinnersLosers(global) {
      const winners = document.getElementById('mob-top-winners');
      const losers = document.getElementById('mob-top-losers');
      if (!winners || !losers || !global) return;
      
      const render = (assets, color) => assets.map(a => `<div class="flex flex-col"><div class="flex items-center gap-1.5"><span class="text-[14px] font-black">${a.ticker}</span><span class="text-[14px] font-black" style="color:${color}">${a.changePercent >= 0 ? '+' : ''}${a.changePercent.toFixed(1)}%</span></div></div>`).join('') || '--';
      winners.innerHTML = render(global.topWinners || [], 'var(--mob-emerald)');
      losers.innerHTML = render(global.topLosers || [], 'var(--mob-rose)');
  }

  async function mobUpdateChart() {
      const ctx = document.getElementById('mob-perf-chart')?.getContext('2d');
      if (!ctx) return;
      try {
          let url = `/api/analytics/global-performance?range=${mobCurrentRange}`;
          if (selectedPortfolioIds.length > 0) url += `&portfolioIds=${selectedPortfolioIds.join(',')}`;
          const res = await fetch(url);
          const result = await res.json();
          const points = result.dataPoints || [];
          
          if (mobPerfChart) mobPerfChart.destroy();
          mobPerfChart = new Chart(ctx, {
              type: 'line',
              data: {
                  labels: points.map(p => new Date(p.date).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' })),
                  datasets: [{
                      data: points.map(p => p.value),
                      borderColor: '#135bec',
                      tension: 0.4,
                      fill: true,
                      backgroundColor: 'rgba(19, 91, 236, 0.1)',
                      borderWidth: 2,
                      pointRadius: 0
                  }]
              },
              options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { display: false } },
                  scales: { x: { display: false }, y: { display: false } }
              }
          });
      } catch(e) { console.error(e); }
  }

  window.mobSetRange = function(range) {
      mobCurrentRange = range;
      document.querySelectorAll('.mob-range-btn').forEach(b => b.classList.toggle('active', b.dataset.range === range));
      mobUpdateChart();
  }

  async function mobSyncMarketStatus() {
      try {
          const res = await fetch('/api/market-status');
          const s = await res.json();
          document.getElementById('mob-dot-eu').className = 'mob-market-dot' + (s.EU ? ' open' : '');
          document.getElementById('mob-dot-us').className = 'mob-market-dot' + (s.US ? ' open' : '');
      } catch(e) {}
  }

  window.openPortfolioModal = function() {
      document.getElementById('portfolio-modal').style.display = 'flex';
  };
  window.closePortfolioModal = function() {
      document.getElementById('portfolio-modal').style.display = 'none';
  };

  document.getElementById('portfolio-form').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('p-id').value;
      const data = {
          name: document.getElementById('p-name').value,
          type: document.getElementById('p-type').value,
          currency: document.getElementById('p-currency').value,
          startDate: document.getElementById('p-date').value,
          initialCash: parseFloat(document.getElementById('p-cash').value),
          color: document.getElementById('p-color').value,
          losses: {}
      };
      const method = id ? 'PUT' : 'POST';
      const url = id ? `/api/portfolios/${id}` : '/api/portfolios';
      const res = await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
      if (res.ok) { closePortfolioModal(); mobUpdateDashboard(); }
  };

  document.addEventListener('DOMContentLoaded', () => {
      mobUpdateDashboard();
      mobUpdateChart();
  });
</script>
</body>
</html>
