<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    .dark .tab-active { background: #1e293b; color: #135bec; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Hide global add transaction FAB */
    #global-mob-fab { display: none !important; }

    /* Indices Ticker Styles */
    .ticker-container {
        width: 100%;
        overflow: hidden;
        background: var(--mob-surface);
        border-bottom: 1px solid var(--mob-border);
        height: 34px;
        display: block;
        white-space: nowrap;
        position: relative;
    }
    .ticker-content {
        display: inline-flex;
        animation: ticker 40s linear infinite;
        width: max-content;
        height: 100%;
        align-items: center;
        will-change: transform;
    }
    .ticker-item {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-right: 48px;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: -0.2px;
    }
    .ticker-name { color: var(--mob-text-muted); text-transform: uppercase; }
    .ticker-price { font-family: 'SF Mono', monospace; color: var(--mob-text); }
    @keyframes ticker {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    /* ── Card View Styles ── */
    .mkcard-grid {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 0;
    }
    .mkcard-row {
        display: grid;
        grid-template-columns: 75px 1fr 68px 112px;
        align-items: center;
        background: var(--mob-surface);
        border-bottom: 1px solid var(--mob-border);
        padding: 6px 8px;
        gap: 8px;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        position: relative;
        z-index: 2;
        will-change: transform;
    }
    .mkcard-row:active { background: var(--mob-border); }
    /* Left accent bar based on gain/loss */
    .mkcard-row::before {
        content: '';
        position: absolute;
        left: 0; top: 5px; bottom: 5px;
        width: 3px;
        border-radius: 0 2px 2px 0;
    }
    .mkcard-row.pos::before { background: var(--mob-emerald); }
    .mkcard-row.neg::before { background: var(--mob-rose); }
</style>

<!-- Mobile Market JS -->
<script>
(function() {
  // ── Swipe Logic ──────────────────────────────────
  let touchStartX = 0;
  let touchMoveX = 0;
  let currentSwipeEl = null;
  const SWIPE_THRESHOLD = 50;
  const ACTION_WIDTH = 195; // 3 buttons * 65px

  window.handleTouchStart = function(e, container) {
    touchStartX = e.touches[0].clientX;
    touchMoveX = 0;
    if (currentSwipeEl && currentSwipeEl !== container) {
      resetSwipes(container);
    }
  };

  window.handleTouchMove = function(e, container) {
    const item = container.querySelector('.mob-holding-item, .mkcard-row');
    if (!item) return;
    touchMoveX = e.touches[0].clientX;
    let diff = touchMoveX - touchStartX;
    if (diff > 0) diff = 0;
    if (diff < -ACTION_WIDTH - 20) diff = -ACTION_WIDTH - 20;
    item.style.transition = 'none';
    item.style.transform = `translateX(${diff}px)`;
  };

  window.handleTouchEnd = function(e, container) {
    // If touch ended on an action button (or its child), do nothing here —
    // the button's own ontouchend handler will fire the action.
    if (e.target.closest('.mob-action-btn')) return;
    const item = container.querySelector('.mob-holding-item, .mkcard-row');
    if (!item) return;
    const diff = touchMoveX - touchStartX;
    
    item.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
    
    // If movement occurred and was beyond threshold, keep actions open.
    // Otherwise (including simple tap), reset to 0. (Tap-to-close)
    if (touchMoveX !== 0 && diff < -SWIPE_THRESHOLD) {
      item.style.transform = `translateX(-${ACTION_WIDTH}px)`;
      currentSwipeEl = container;
    } else {
      item.style.transform = 'translateX(0)';
      currentSwipeEl = null;
    }
  };

  // Handles action button taps reliably on mobile.
  // When the swipe panel is open, browsers suppress the synthetic 'click'
  // event because touchmove was recorded on the parent. We bypass this by
  // attaching ontouchend directly on each button which calls the action and
  // then resets the swipe state.
  window.mobActionTap = function(e, fn) {
    e.stopPropagation();
    e.preventDefault();
    // Reset swipe state so the row closes after the action
    const container = e.target.closest('.mob-holding-swipe-container');
    if (container) {
      const item = container.querySelector('.mob-holding-item, .mkcard-row');
      if (item) {
        item.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
        item.style.transform = 'translateX(0)';
      }
      currentSwipeEl = null;
    }
    // Small delay so the reset animation starts before the modal opens
    setTimeout(fn, 60);
  };

  function resetSwipes(except) {
    document.querySelectorAll('.mob-holding-swipe-container').forEach(c => {
      if (c === except) return;
      const item = c.querySelector('.mob-holding-item, .mkcard-row');
      if (item) item.style.transform = 'translateX(0)';
    });
    currentSwipeEl = null;
  }

  // ── View Mode (Card / Normal / Compact) ────────────────────────────────────────
  let _marketViewMode = localStorage.getItem('market_view_mode') || 'card';

  window.setMarketView = function(mode) {
    _marketViewMode = mode;
    localStorage.setItem('market_view_mode', mode);
    updateViewToggle();
    mobLoadAssets();
  };

  // ── Sort Mode (changePercent / name / dailyVal / totalGain) ──────────────────────
  let _marketSortMode = localStorage.getItem('market_sort_mode') || 'changePercent';

  const _activeTag   = 'text-[9px] font-black uppercase px-2.5 py-1 rounded-md transition-all bg-primary text-white shadow-sm';
  const _inactiveTag = 'text-[9px] font-black uppercase px-2.5 py-1 rounded-md transition-all bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700';

  window.setMarketSort = function(mode) {
    _marketSortMode = mode;
    localStorage.setItem('market_sort_mode', mode);
    updateSortToggle();
    mobLoadAssets();
  };

  function updateSortToggle() {
    const btnPct  = document.getElementById('btn-sort-pct');
    const btnName = document.getElementById('btn-sort-name');
    const btnVal  = document.getElementById('btn-sort-val');
    const btnAbs  = document.getElementById('btn-sort-abs');
    if (btnPct)  btnPct.className  = _marketSortMode === 'changePercent' ? _activeTag : _inactiveTag;
    if (btnName) btnName.className = _marketSortMode === 'name'          ? _activeTag : _inactiveTag;
    if (btnVal)  btnVal.className  = _marketSortMode === 'dailyVal'       ? _activeTag : _inactiveTag;
    if (btnAbs)  btnAbs.className  = _marketSortMode === 'totalGain'      ? _activeTag : _inactiveTag;
  }

  // ── Font Scaling (0.7 to 1.5) ──────────────────────────────────────────────────
  let _marketScale = parseFloat(localStorage.getItem('market_font_scale')) || 1.0;

  window.changeMarketScale = function(amount) {
    _marketScale = Math.max(0.7, Math.min(1.5, _marketScale + amount));
    localStorage.setItem('market_font_scale', _marketScale);
    updateMarketScale();
  };

  function updateMarketScale() {
    const listEl = document.getElementById('mob-list-positions');
    if (listEl) {
      listEl.style.setProperty('--mkcard-scale', _marketScale);
    }
  }

  const _activeBtn = 'p-1 rounded-md transition-all bg-white dark:bg-slate-700 text-primary shadow-sm';
  const _inactiveBtn = 'p-1 rounded-md transition-all text-slate-400 dark:text-slate-500';

  function updateViewToggle() {
    const btnCard = document.getElementById('btn-view-card');
    const btnN    = document.getElementById('btn-view-normal');
    const btnC    = document.getElementById('btn-view-compact');
    if (btnCard) btnCard.className = _marketViewMode === 'card'    ? _activeBtn : _inactiveBtn;
    if (btnN)    btnN.className    = _marketViewMode === 'normal'  ? _activeBtn : _inactiveBtn;
    if (btnC)    btnC.className    = _marketViewMode === 'compact' ? _activeBtn : _inactiveBtn;
  }

  window.mobViewAssetDetails = function(ticker, name, currency) {
    // Consistent with other pages, we open the chart
    if (typeof openAssetChartModal === 'function') {
        openAssetChartModal(ticker, name, currency);
    }
  };
  window.showMobDetails = window.mobViewAssetDetails;

  // Abbreviates long asset names for compact display
  function abbreviateName(name, maxLen = 22) {
    if (!name) return '';
    // Remove common legal suffixes
    name = name
      .replace(/\b(Incorporated|Corporation|Limited|Company|Group)\b/gi, '')
      .replace(/\b(Inc\.|Corp\.|Ltd\.|Co\.|S\.p\.A\.|N\.V\.|PLC|S\.A\.|GmbH|AG|LLC|LP|SE|ASA|AB)\b/gi, '')
      .replace(/\b(UCITS|Accumulating|Distributing|Acc\.|Dist\.|ETF Fund|SICAV)\b/gi, '')
      .replace(/[,\s.]+$/, '')
      .replace(/\s{2,}/g, ' ')
      .trim();
    if (name.length > maxLen) name = name.substring(0, maxLen).trim() + '\u2026';
    return name;
  }

  // Formats price with currency symbol at the end: "182€", "42,3$", "4,87£"
  function fmtPriceCompact(price, currency, dec) {
    const sym = currency === 'USD' ? '$' : currency === 'GBP' ? '£' : '€';
    const n = new Intl.NumberFormat('it-IT', {
      minimumFractionDigits: dec,
      maximumFractionDigits: dec,
      useGrouping: true
    }).format(price);
    return n + sym;
  }

  window.mobViewAssetTransactions = function(ticker) {
    // Navigate to portfolio detail and auto-filter transactions
    // Since we don't know the portfolio ID from here easily, 
    // we can either search for it or just show a message.
    // For now, let's just navigate to the FIRST portfolio that has this asset.
    fetch(`/api/assets/${ticker}/portfolios`).then(r => r.json()).then(data => {
        if (data && data.length > 0) {
            window.location.href = `/portfolio?id=${data[0].id}&ticker=${ticker}`;
        }
    });
  };

  function mobSyncPrivacyIcon() {
    const icon = document.getElementById('mob-privacy-icon');
    if (icon) icon.innerText = window.privacyState?.enabled ? 'visibility_off' : 'visibility';
  }

  async function mobLoadIndices() {
    try {
      const res = await fetch('/api/market/indices');
      const data = await res.json();
      const content = document.getElementById('mob-indices-content');
      if (!content || !data.length) return;
      
      const html = data.map(idx => {
        const isPos = idx.changePercent >= 0;
        const color = isPos ? 'var(--mob-emerald)' : 'var(--mob-rose)';
        const sign = isPos ? '+' : '';
        const price = (idx.price || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
        const change = (idx.changePercent || 0).toFixed(1);
        return `
          <div class="ticker-item">
            <span class="ticker-name">${idx.name}</span>
            <span class="ticker-price">${price}</span>
            <span style="color:${color}; font-weight:900">${sign}${change}%</span>
          </div>
        `;
      }).join('');
      
      // Double the items for a perfect seamless loop with -50% translation
      content.innerHTML = html + html;
    } catch(e) { console.error('[MOB] Indices load error:', e); }
  }

  async function mobSyncMarketStatus() {
    try {
      const res = await fetch('/api/market-status');
      const s = await res.json();
      window._mobMarketOpen = s.anyOpen;
      const dotEu = document.getElementById('mob-dot-eu');
      const dotUs = document.getElementById('mob-dot-us');
      if (dotEu) { dotEu.className = 'mob-market-dot' + (s.euOpen ? ' live' : ''); }
      if (dotUs) { dotUs.className = 'mob-market-dot' + (s.usOpen ? ' live' : ''); }
    } catch(e) {}
  }

  async function mobLoadMovers() {
    try {
      const res = await fetch('/api/market/movers');
      const movers = await res.json();
      const container = document.getElementById('mob-movers-carousel');
      const section = document.getElementById('mob-movers-section');
      if (!container || !section) return;

      if (!movers || movers.length === 0) {
        section.style.display = 'none';
        return;
      }
      section.style.display = '';

      const gainers = movers.filter(m => m.changePercent > 0)
                            .sort((a, b) => b.changePercent - a.changePercent)
                            .slice(0, 5);
      const losers  = movers.filter(m => m.changePercent < 0)
                            .sort((a, b) => a.changePercent - b.changePercent)
                            .slice(0, 5);

      const renderCard = (m) => {
        const isPos = m.changePercent >= 0;
        const color = isPos ? 'var(--mob-emerald)' : 'var(--mob-rose)';
        const bg    = isPos ? 'rgba(16,185,129,0.08)' : 'rgba(244,63,94,0.08)';
        const border= isPos ? 'rgba(16,185,129,0.25)' : 'rgba(244,63,94,0.25)';
        const sign  = isPos ? '+' : '';
        const price = (m.currentPrice || 0).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        return `
          <div onclick="window.showMobDetails('${m.ticker}', '${(m.name||'').replace(/'/g,"\\'")}', '${m.currency||'EUR'}')"
               style="flex-shrink:0; width:100px; border-radius:12px; padding:8px 6px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; cursor:pointer; background:${bg}; border:1px solid ${border}; margin-right:8px;">
            <span style="font-size:11px; font-weight:900; color:var(--mob-text); text-transform:uppercase; letter-spacing:-0.3px; line-height:1; margin-bottom:4px;">${m.ticker}</span>
            <span style="font-size:16px; font-weight:900; color:${color}; line-height:1; margin-bottom:2px;">${sign}${m.changePercent.toFixed(1)}%</span>
            <span style="font-size:9px; font-weight:700; color:var(--mob-text-muted);">${price} ${m.currency||''}</span>
          </div>`;
      };

      let html = '';
      if (gainers.length > 0) {
        html += `<div style="padding:4px 0 2px 0;">
          <div style="font-size:9px; font-weight:900; color:var(--mob-emerald); text-transform:uppercase; letter-spacing:0.12em; padding:0 4px 6px 4px;">▲ Top</div>
          <div style="display:flex; overflow-x:auto; padding-bottom:4px;" class="no-scrollbar">
            ${gainers.map(renderCard).join('')}
          </div>
        </div>`;
      }
      if (losers.length > 0) {
        html += `<div style="padding:4px 0 2px 0;">
          <div style="font-size:9px; font-weight:900; color:var(--mob-rose); text-transform:uppercase; letter-spacing:0.12em; padding:0 4px 6px 4px;">▼ Worst</div>
          <div style="display:flex; overflow-x:auto; padding-bottom:4px;" class="no-scrollbar">
            ${losers.map(renderCard).join('')}
          </div>
        </div>`;
      }

      container.innerHTML = html;
    } catch(e) { console.error('[MOB] Movers load error:', e); }
  }

  async function mobLoadAssets() {
    try {
      const res = await fetch('/api/assets');
      const assets = (await res.json()).filter(a => a.ticker !== 'CASH');
      
      const sortSelect = document.getElementById('mob-sort-select');
      if (sortSelect) sortSelect.value = _marketSortMode;
      
      const posContainer = document.getElementById('mob-list-positions');
      const posCountEl = document.getElementById('mob-pos-count');

      const openPos = assets.filter(a => a.hasPosition).sort((a, b) => {
        if (_marketSortMode === 'name') {
          return (a.name || '').localeCompare(b.name || '');
        } else if (_marketSortMode === 'dailyVal') {
          const valA = (a.changeValue || 0) * (a.totalQuantity || 0);
          const valB = (b.changeValue || 0) * (b.totalQuantity || 0);
          return valB - valA;
        } else if (_marketSortMode === 'totalGain') {
          const valA = a.totalGainEUR !== undefined ? a.totalGainEUR : (((a.currentPrice || 0) * (a.totalQuantity || 0)) - (a.totalCostAssetCurr || 0));
          const valB = b.totalGainEUR !== undefined ? b.totalGainEUR : (((b.currentPrice || 0) * (b.totalQuantity || 0)) - (b.totalCostAssetCurr || 0));
          return valB - valA;
        } else {
          return (b.changePercent || 0) - (a.changePercent || 0);
        }
      });

      if (posCountEl) posCountEl.textContent = `${openPos.length} Assets`;

      const getAssetTypeColors = (type, ticker) => {
        const t = (type || '').toUpperCase();
        const tk = (ticker || '').toUpperCase();
        
        let bg = 'rgba(239, 68, 68, 0.15)';
        let text = '#ef4444';
        let border = 'rgba(239, 68, 68, 0.3)';
        
        if (t.includes('LIQUID') || t.includes('CASH') || tk.includes('CASH')) {
            bg = 'rgba(22, 101, 52, 0.15)'; text = '#166534'; border = 'rgba(22, 101, 52, 0.3)';
        } else if (t.includes('DEPOSITO') || t.includes('CONTO')) {
            bg = 'rgba(21, 128, 61, 0.15)'; text = '#15803d'; border = 'rgba(21, 128, 61, 0.3)';
        } else if (t.includes('MONETARIO') || tk.includes('XEON') || tk.includes('LEON') || tk.includes('C3M') || tk.includes('SMART')) {
            bg = 'rgba(74, 222, 128, 0.15)'; text = '#4ade80'; border = 'rgba(74, 222, 128, 0.3)';
        } else if (t.includes('BOND') || t.includes('OBBLIG') || tk.startsWith('BTP') || t.includes('FIXED INCOME')) {
            bg = 'rgba(234, 179, 8, 0.15)'; text = '#eab308'; border = 'rgba(234, 179, 8, 0.3)';
        } else if (t.includes('ETF AZION') || t.includes('ETF')) {
            bg = 'rgba(249, 115, 22, 0.15)'; text = '#f97316'; border = 'rgba(249, 115, 22, 0.3)';
        } else if (t.includes('ETC') || t.includes('COMMODIT') || t.includes('MATERIE PRIME')) {
            bg = 'rgba(20, 184, 166, 0.15)'; text = '#14b8a6'; border = 'rgba(20, 184, 166, 0.3)';
        } else if (t.includes('CRYPTO') || t.includes('VALUTA')) {
            bg = 'rgba(139, 92, 246, 0.15)'; text = '#8b5cf6'; border = 'rgba(139, 92, 246, 0.3)';
        } else if (t.includes('AZION') || t.includes('STOCK') || t.includes('EQUITY')) {
            bg = 'rgba(239, 68, 68, 0.15)'; text = '#ef4444'; border = 'rgba(239, 68, 68, 0.3)';
        }
        
        return { bg, text, border };
      };

      // ── AI badge renderer (reusable) ────────────────────────────────
      function renderAiBadgeMob(a) {
        const tickerEsc = a.ticker.replace(/'/g, "\\'");
        const nameEsc = (a.name || '').replace(/'/g, "\\'");
        const cur = a.currency || 'EUR';
        if (a.aiBadges && a.aiBadges.length > 0) {
          return a.aiBadges.map(badge => {
            const engine = badge.engine || 'X';
            let icon = 'smart_toy';
            if (engine === 'Gemini') icon = 'auto_awesome';
            else if (engine === 'Qwen') icon = 'chat_spark';
            else if (engine === 'Agnes') icon = 'psychiatry';
            else if (engine === 'OpenAI') icon = 'data_exploration';
            let clr = 'border-slate-500/30 text-slate-500 bg-slate-500/10';
            if (badge.aiAction === 'BUY' || badge.aiAction === 'INCREASE') clr = 'border-emerald-500/30 text-emerald-500 bg-emerald-500/10';
            else if (badge.aiAction === 'SELL' || badge.aiAction === 'DECREASE') clr = 'border-rose-500/30 text-rose-500 bg-rose-500/10';
            
            let fvStr = badge.aiAction;
            if (badge.aiTargetPrice) {
              const num = parseFloat(badge.aiTargetPrice);
              let dec = 2;
              if (num > 30) dec = 0;
              else if (num > 10) dec = 1;
              fvStr = num.toLocaleString('it-IT', { minimumFractionDigits: dec, maximumFractionDigits: dec });
            }
            
            return `<span onclick="event.stopPropagation();window.openAssetAiHistoryModal('${tickerEsc}','${nameEsc}','${cur}')" class="px-1.5 py-0.5 rounded font-black uppercase tracking-tighter flex items-center gap-1 border ${clr} cursor-pointer whitespace-nowrap" style="font-size: calc(10px * var(--mkcard-scale, 1))">
              <span class="material-symbols-outlined" style="font-size: calc(12px * var(--mkcard-scale, 1))">${icon}</span> ${fvStr}</span>`;
          }).join('');
        } else if ((a.aiHistoryCount || 0) > 0) {
          return `<span onclick="event.stopPropagation();window.openAssetAiHistoryModal('${tickerEsc}','${nameEsc}','${cur}')" class="px-1.5 py-0.5 rounded font-black uppercase tracking-tighter flex items-center gap-1 border border-slate-500/30 text-slate-500 bg-slate-500/10 cursor-pointer" style="font-size: calc(10px * var(--mkcard-scale, 1))">
            <span class="material-symbols-outlined" style="font-size: calc(12px * var(--mkcard-scale, 1))">smart_toy</span> ${a.aiHistoryCount}</span>`;
        }
        return `<span onclick="event.stopPropagation();window.openAssetAiHistoryModal('${tickerEsc}','${nameEsc}','${cur}')" class="px-1.5 py-0.5 rounded font-black uppercase tracking-tighter flex items-center gap-1 border border-slate-400/30 text-slate-400 bg-slate-400/10 cursor-pointer" style="font-size: calc(10px * var(--mkcard-scale, 1))">
          <span class="material-symbols-outlined" style="font-size: calc(12px * var(--mkcard-scale, 1))">smart_toy</span></span>`;
      }

      // ── Action buttons (swipeable) ───────────────────────────────────
      function renderActions(a) {
        const tickerEsc = a.ticker.replace(/'/g, "\\'");
        const countryEsc = (a.country || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        const openModal = `openManualModal('${tickerEsc}','${a.currency}',${a.currentPrice},'${a.type}','${countryEsc}','${a.dataSource}','${a.isin}')`;
        if (a.hasPosition) {
          return `<div class="mob-holding-actions">
            <div class="mob-action-btn bg-blue-ios" ontouchend="mobActionTap(event,()=>mobViewAssetTransactions('${tickerEsc}'))" onclick="event.stopPropagation();mobViewAssetTransactions('${tickerEsc}')">
              <span class="material-symbols-outlined">list</span><span>Trans</span>
            </div>
            <div class="mob-action-btn bg-orange-ios" ontouchend="mobActionTap(event,()=>${openModal})" onclick="event.stopPropagation();${openModal}">
              <span class="material-symbols-outlined">edit_note</span><span>Modifica</span>
            </div>
          </div>`;
        }
        return `<div class="mob-holding-actions">
          <div class="mob-action-btn bg-orange-ios" ontouchend="mobActionTap(event,()=>${openModal})" onclick="event.stopPropagation();${openModal}">
            <span class="material-symbols-outlined">edit_note</span><span>Modifica</span>
          </div>
          <div class="mob-action-btn bg-red-ios" ontouchend="mobActionTap(event,()=>removeFromWatchlist('${tickerEsc}',${!!a.hasPosition}))" onclick="event.stopPropagation();removeFromWatchlist('${tickerEsc}',${!!a.hasPosition})">
            <span class="material-symbols-outlined">delete</span><span>Rimuovi</span>
          </div>
        </div>`;
      }

      // ── NEW Card View renderer ──────────────────────────────────────
      function renderCardView(a) {
        const price    = a.currentPrice || 0;
        const change   = a.changePercent || 0;
        const isPos    = change >= 0;
        const chgColor = isPos ? 'var(--mob-emerald)' : 'var(--mob-rose)';
        const tickerEsc = a.ticker.replace(/'/g, "\\'");
        const nameEsc   = (a.name || '').replace(/'/g, "\\'");
        const cur = a.currency || 'EUR';

        // Daily gain
        const _chgVal  = (a.changeValue || 0) * (a.totalQuantity || 0);
        const _dgColor = _chgVal >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)';
        const _dgSign  = _chgVal >= 0 ? '+' : '';

        // Total position gain
        const _totalVal     = price * (a.totalQuantity || 0);
        const _totalGain    = a.totalGainEUR !== undefined ? a.totalGainEUR : (_totalVal - (a.totalCostAssetCurr || 0));
        const _totGainIsPos = _totalGain >= 0;
        const _totGainColor = _totGainIsPos ? 'var(--mob-emerald)' : 'var(--mob-rose)';
        const _totGainSign  = (_totGainIsPos && Math.abs(_totalGain) >= 0.5) ? '+' : '';
        const _totGainCur   = a.totalGainEUR !== undefined ? 'EUR' : cur;

        const hasDailyGain = a.hasPosition && Math.abs(_chgVal) >= 0.01;
        const hasTotalGain = a.hasPosition && _totalVal > 0;

        // Portfolio names concatenation
        const portName = (a.portfoliosInfo && a.portfoliosInfo.length > 0) ? a.portfoliosInfo.map(p => p.name).join('/') : '';
        const exchangeLabel = a.exchange || 'MKT';

        const priceFmt = fmtPriceCompact(price, cur, price >= 100 ? 0 : price >= 10 ? 1 : 2);
        
        // Asset type colors
        const colors = getAssetTypeColors(a.type || a.yfType, a.ticker);

        // Absolute variation calculations
        const invested = a.totalCostAssetCurr || 0;
        const _absPct  = invested > 0 ? ((_totalVal - invested) / invested) * 100 : 0;
        const absPctColor = _absPct >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)';

        // Formatted Column 4 rows
        const todayVarPct = `${isPos ? '+' : ''}${change.toFixed(1)}%`;
        const todayVarStr = hasDailyGain ? `${_dgSign}${fmtPriceCompact(_chgVal, cur, 0)}` : '—';

        const absVarPct = hasTotalGain ? `${_absPct >= 0 ? '+' : ''}${_absPct.toFixed(1)}%` : '—';
        const absVarVal = hasTotalGain ? ` / ${_totGainSign}${fmtPriceCompact(_totalGain, _totGainCur, 0)}` : '';
        const absVarStr = `${absVarPct}${absVarVal}`;

        return `
          <div class="mob-holding-swipe-container"
               ontouchstart="handleTouchStart(event,this)"
               ontouchmove="handleTouchMove(event,this)"
               ontouchend="handleTouchEnd(event,this)">
            ${renderActions(a)}
            <div class="mkcard-row ${isPos ? 'pos' : 'neg'}"
                 onclick="window.showMobDetails('${tickerEsc}','${nameEsc}','${cur}')">
              
              <!-- Col 1: Ticker TAG & Price -->
              <div style="display:flex; flex-direction:column; gap:3px; align-items:flex-start; min-width:0">
                <span style="background:${colors.bg}; color:${colors.text}; border:1px solid ${colors.border}; border-radius:4px; padding:1px 5px; font-size:calc(10px * var(--mkcard-scale, 1)); font-weight:900; text-transform:uppercase; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; max-width:100%">${a.ticker}</span>
                <span style="font-size:calc(13px * var(--mkcard-scale, 1)); font-weight:900; font-family:'SF Mono',monospace; color:var(--mob-text)">${priceFmt}&nbsp;<span style="color:${chgColor}; font-size:calc(11px * var(--mkcard-scale, 1)); font-weight:900">${todayVarPct}</span></span>
              </div>

              <!-- Col 2: Name & Portafoglio / Mercato -->
              <div style="display:flex; flex-direction:column; gap:2px; min-width:0">
                <div style="font-size:calc(12px * var(--mkcard-scale, 1)); font-weight:900; color:var(--mob-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${abbreviateName(a.name, 15)}</div>
                <div style="font-size:calc(9px * var(--mkcard-scale, 1)); font-weight:700; color:var(--mob-text-muted); text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">
                  ${portName ? `${abbreviateName(portName, 12)} / ${exchangeLabel}` : exchangeLabel}
                </div>
              </div>

              <!-- Col 3: AI Target Price TAG -->
              <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; gap:3px; min-width:0; height:100%">
                ${renderAiBadgeMob(a)}
              </div>

              <!-- Col 4: Today Var (% / Val) & Absolute Var (% / Val) -->
              <div style="display:flex; flex-direction:column; align-items:flex-end; gap:2px; min-width:0; text-align:right">
                <div style="font-size:calc(12px * var(--mkcard-scale, 1)); font-weight:900; color:${chgColor}; font-family:'SF Mono',monospace; white-space:nowrap">${todayVarStr}</div>
                <div style="font-size:calc(12px * var(--mkcard-scale, 1)); font-weight:700; color:${hasTotalGain ? absPctColor : 'var(--mob-text-muted)'}; font-family:'SF Mono',monospace; white-space:nowrap">${absVarStr}</div>
              </div>
            </div>
          </div>`;
      }

      // ── Legacy Normal / Compact renderer ────────────────────────────
      const renderCard = (a) => {
        if (_marketViewMode === 'card') return renderCardView(a);

        const price = a.currentPrice || 0;
        const change = a.changePercent || 0;
        const isPos = change >= 0;
        const color = isPos ? 'var(--mob-emerald)' : 'var(--mob-rose)';

        const colors = getAssetTypeColors(a.type || a.yfType, a.ticker);
        const tickerEsc = a.ticker.replace(/'/g, "\\'");

        const showLogo = _marketViewMode !== 'compact';
        const _chgVal = (a.changeValue || 0) * (a.totalQuantity || 0);
        const _showDailyGain = !showLogo && a.hasPosition && _chgVal !== 0;
        const _dgColor = _chgVal >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)';
        const _dgSign = _chgVal >= 0 ? '+' : '';
        const _totalVal = (a.currentPrice || 0) * (a.totalQuantity || 0);
        const _totalGain = a.totalGainEUR !== undefined ? a.totalGainEUR : (_totalVal - (a.totalCostAssetCurr || 0));
        const _totalGainCurrency = a.totalGainEUR !== undefined ? 'EUR' : a.currency;
        const _totGainIsPos = _totalGain >= 0;
        const _totGainColor = _totGainIsPos ? 'var(--mob-emerald)' : 'var(--mob-rose)';
        const _totGainSign = (_totGainIsPos && Math.abs(_totalGain) >= 0.5) ? '+' : '';
        const _showTotals = !showLogo && a.hasPosition && _totalVal > 0;

        return `
          <div class="mob-holding-swipe-container"
               ontouchstart="handleTouchStart(event,this)"
               ontouchmove="handleTouchMove(event,this)"
               ontouchend="handleTouchEnd(event,this)">
            ${renderActions(a)}
            <div class="mob-holding-item" onclick="window.showMobDetails('${tickerEsc}','${(a.name||'').replace(/'/g,"\\'")  }','${a.currency||'EUR'}')">
              <div class="mob-holding-info">
                <div class="flex items-center gap-2">
                  <div class="px-2 py-0.5 rounded-md text-[10px] font-black uppercase tracking-wider border" style="background:${colors.bg};color:#000000;border-color:${colors.border};display:inline-block">${a.ticker}</div>
                  ${renderAiBadgeMob(a)}
                </div>
                <div class="mob-holding-name" style="margin-top:2px">${abbreviateName(a.name)||''}</div>
              </div>
              <div class="mob-holding-values">
                ${showLogo ? `
                  <div class="mob-holding-value">${formatCurrency(price, a.currency, price>=100?0:price>=10?1:2)}</div>
                  <div class="flex items-center justify-end gap-1.5 mt-0.5">
                    ${(a.preMarketChangePercent&&Math.abs(a.preMarketChangePercent)>0.01&&!window._mobMarketOpen)?`<span style="font-size:10px;font-weight:900;color:${a.preMarketChangePercent>=0?'var(--mob-emerald)':'var(--mob-rose)'}">(${a.preMarketChangePercent>=0?'+':''}${a.preMarketChangePercent.toFixed(1)}%)</span>`:''}
                    ${(a.postMarketChangePercent&&Math.abs(a.postMarketChangePercent)>0.01&&!window._mobMarketOpen)?`<span style="font-size:10px;font-weight:900;color:${a.postMarketChangePercent>=0?'var(--mob-emerald)':'var(--mob-rose)'}">(${a.postMarketChangePercent>=0?'+':''}${a.postMarketChangePercent.toFixed(1)}%)</span>`:''}
                    <div class="mob-holding-gain" style="color:${color};font-weight:900;margin-top:0">${isPos?'+':''}${change.toFixed(1)}%</div>
                  </div>
                ` : `
                  <div class="mob-compact-values">
                    <span class="mob-cv-gain" style="color:${_dgColor}">${_showDailyGain?_dgSign+fmtPriceCompact(_chgVal,a.currency,0):''}</span>
                    <span class="mob-holding-gain" style="color:${color};font-weight:900;margin-top:0">${isPos?'+':''}${change.toFixed(1)}%</span>
                    <span class="mob-holding-value">${fmtPriceCompact(price,a.currency,price>=100?0:price>=10?1:2)}</span>
                  </div>
                  ${_showTotals?`<div class="mob-compact-values" style="margin-top:2px;opacity:0.85">
                    <span style="display:inline-flex;justify-content:flex-end;padding-right:6px"><span style="background:${_totGainIsPos?'rgba(16,185,129,0.15)':'rgba(244,63,94,0.15)'};color:${_totGainColor};font-size:calc(11px * var(--mob-scale,1));font-weight:700;white-space:nowrap;border-radius:4px;padding:1px 5px;letter-spacing:-0.2px">${_totGainSign}${fmtPriceCompact(_totalGain,_totalGainCurrency,0)}</span></span>
                    <span></span>
                    <span style="text-align:right;font-size:calc(11px * var(--mob-scale,1));font-weight:500;color:var(--mob-text-muted);white-space:nowrap;padding-left:8px">${fmtPriceCompact(_totalVal,a.currency,0)}</span>
                  </div>`:''}
                `}
              </div>
            </div>
          </div>`;
      };





      if (posContainer) {
        posContainer.innerHTML = openPos.map(a => renderCard(a, true)).join('') || '<div class="mob-empty">Nessuna posizione</div>';
        updateMarketScale();
      }

    } catch(e) { console.error('[MOB] Market load error:', e); }
  }

  let _searchDebounce;
  window.mobSearchAssets = function(q) {
    const results = document.getElementById('mob-search-results');
    if (!q || q.length < 2) { results.classList.add('hidden'); return; }
    clearTimeout(_searchDebounce);
    _searchDebounce = setTimeout(async () => {
      try {
        const res = await fetch(`/api/asset-search?query=${encodeURIComponent(q)}`);
        const quotes = await res.json();
        if (quotes && quotes.length > 0) {
          results.innerHTML = quotes.map(q => `
            <div class="px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer border-b border-slate-100 dark:border-slate-800"
                 onclick="mobSelectAsset('${q.symbol}','${(q.shortname||q.longname||'').replace(/'/g,"\\'")}')">
              <div class="font-bold text-primary text-xs">${q.symbol}</div>
              <div class="text-[10px] text-slate-500 truncate">${q.shortname||q.longname}</div>
            </div>`).join('');
          results.classList.remove('hidden');
        }
      } catch(e) {}
    }, 300);
  };

  let _selectedTicker = '';
  let _selectedName = '';
  window.mobSelectAsset = function(ticker, name) {
    _selectedTicker = ticker;
    _selectedName = name;
    document.getElementById('mob-asset-search').value = ticker;
    document.getElementById('mob-search-results').classList.add('hidden');
  };

  window.mobQuickAdd = async function() {
    const ticker = _selectedTicker || document.getElementById('mob-asset-search').value.trim();
    if (!ticker) return;
    try {
      const res = await fetch('/api/assets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticker, name: _selectedName })
      });
      if (res.ok) {
        document.getElementById('mob-asset-search').value = '';
        _selectedTicker = ''; _selectedName = '';
        mobLoadAssets();
      }
    } catch(e) {}
  };





  function mobInit() {
    if (!window._mobileViewActive) return;
    mobSyncPrivacyIcon();
    mobSyncMarketStatus();
    mobLoadIndices();
    mobLoadMovers();
    mobLoadAssets();
    updateViewToggle();
    updateSortToggle();
    updateMarketScale();
  }

  window.addEventListener('mobile-view-activated', mobInit);
  document.addEventListener('DOMContentLoaded', () => { if (window._mobileViewActive) mobInit(); });
  window.addEventListener('privacy-changed', () => {
    mobSyncPrivacyIcon();
    if (window._mobileViewActive) mobLoadAssets();
  });
  window.addEventListener('market-data-updated', () => {
    if (window._mobileViewActive) mobLoadAssets();
  });
})();
</script>
</body>
</html>
