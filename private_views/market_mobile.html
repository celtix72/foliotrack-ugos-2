        width: 100%;
        overflow: hidden;

        display: flex;
        align-items: center;
        gap: 6px;

        font-weight: 900;

    .ticker-price { font-family: 'SF Mono', monospace; color: var(--mob-text); }
    @keyframes ticker {

<script>
(function() {
  // ── Swipe Logic ──────────────────────────────────
  let touchStartX = 0;
  let touchMoveX = 0;
  let currentSwipeEl = null;
  const SWIPE_THRESHOLD = 50;
  const ACTION_WIDTH = 195; // 3 buttons * 65px (Standard width for mobile actions)

  window.handleTouchStart = function(e, container) {
    touchStartX = e.touches[0].clientX;
    touchMoveX = 0;
    if (currentSwipeEl && currentSwipeEl !== container) {
      resetSwipes(container);
    }
  };

  window.handleTouchMove = function(e, container) {
    const item = container.querySelector('.mob-holding-item');
    if (!item) return;
    touchMoveX = e.touches[0].clientX;
    let diff = touchMoveX - touchStartX;
    if (diff > 0) diff = 0;
    if (diff < -ACTION_WIDTH - 20) diff = -ACTION_WIDTH - 20;
    item.style.transition = 'none';
    item.style.transform = `translateX(${diff}px)`;
  };

  window.handleTouchEnd = function(e, container) {
    const item = container.querySelector('.mob-holding-item');
    if (!item) return;
    const diff = touchMoveX - touchStartX;
    
    item.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
    
    // If movement occurred and was beyond threshold, keep actions open.
    // Otherwise (including simple tap), reset to 0. (Tap-to-close)
    if (touchMoveX !== 0 && diff < -SWIPE_THRESHOLD) {
      item.style.transform = `translateX(-${ACTION_WIDTH}px)`;
      currentSwipeEl = container;
    } else {
      item.style.transform = 'translateX(0)';
      currentSwipeEl = null;
    }
  };

  function resetSwipes(except) {
    document.querySelectorAll('.mob-holding-swipe-container').forEach(c => {
      if (c === except) return;
      const item = c.querySelector('.mob-holding-item');
      if (item) item.style.transform = 'translateX(0)';
    });
    currentSwipeEl = null;
  }

  // ── View Mode (Normal / Compact) ────────────────────────────────────────
  let _marketViewMode = localStorage.getItem('market_view_mode') || 'normal';

  window.setMarketView = function(mode) {
    _marketViewMode = mode;
    localStorage.setItem('market_view_mode', mode);
    updateViewToggle();
    mobLoadAssets();
  };

  function updateViewToggle() {
    const btnN = document.getElementById('btn-view-normal');
    const btnC = document.getElementById('btn-view-compact');
    const isCompact = _marketViewMode === 'compact';
    if (btnN) btnN.className = isCompact
      ? 'p-1 rounded-md transition-all text-slate-400 dark:text-slate-500'
      : 'p-1 rounded-md transition-all bg-white dark:bg-slate-700 text-primary shadow-sm';
    if (btnC) btnC.className = isCompact
      ? 'p-1 rounded-md transition-all bg-white dark:bg-slate-700 text-primary shadow-sm'
      : 'p-1 rounded-md transition-all text-slate-400 dark:text-slate-500';
  }

  window.mobViewAssetDetails = function(ticker, name, currency) {
    // Consistent with other pages, we open the chart
    if (typeof openAssetChartModal === 'function') {
        openAssetChartModal(ticker, name, currency);
    }
  };
  window.showMobDetails = window.mobViewAssetDetails;

  // Abbreviates long asset names for compact display
  function abbreviateName(name, maxLen = 22) {
    if (!name) return '';
    // Remove common legal suffixes
    name = name
      .replace(/\b(Incorporated|Corporation|Limited|Company|Group)\b/gi, '')
      .replace(/\b(Inc\.|Corp\.|Ltd\.|Co\.|S\.p\.A\.|N\.V\.|PLC|S\.A\.|GmbH|AG|LLC|LP|SE|ASA|AB)\b/gi, '')
      .replace(/\b(UCITS|Accumulating|Distributing|Acc\.|Dist\.|ETF Fund|SICAV)\b/gi, '')
      .replace(/[,\s.]+$/, '')
      .replace(/\s{2,}/g, ' ')
      .trim();
    if (name.length > maxLen) name = name.substring(0, maxLen).trim() + '\u2026';
    return name;
  }

  window.mobViewAssetTransactions = function(ticker) {
    // Navigate to portfolio detail and auto-filter transactions
    // Since we don't know the portfolio ID from here easily, 
    // we can either search for it or just show a message.
    // For now, let's just navigate to the FIRST portfolio that has this asset.
    fetch(`/api/assets/${ticker}/portfolios`).then(r => r.json()).then(data => {
        if (data && data.length > 0) {
            window.location.href = `/portfolio?id=${data[0].id}&ticker=${ticker}`;
        }
    });
  };

  function mobSyncPrivacyIcon() {
    const icon = document.getElementById('mob-privacy-icon');
    if (icon) icon.innerText = window.privacyState?.enabled ? 'visibility_off' : 'visibility';
  }

  async function mobLoadIndices() {
    try {
      const res = await fetch('/api/market/indices');
      const data = await res.json();
      const content = document.getElementById('mob-indices-content');
      if (!content || !data.length) return;
      
      const html = data.map(idx => {
        const isPos = idx.changePercent >= 0;
        const color = isPos ? 'var(--mob-emerald)' : 'var(--mob-rose)';
        const sign = isPos ? '+' : '';
        const price = (idx.price || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
        const change = (idx.changePercent || 0).toFixed(1);
        return `
          <div class="ticker-item">
            <span class="ticker-name">${idx.name}</span>
            <span class="ticker-price">${price}</span>
            <span style="color:${color}; font-weight:900">${sign}${change}%</span>
          </div>
        `;
      }).join('');
      
      // Double the items for a perfect seamless loop with -50% translation
      content.innerHTML = html + html;
    } catch(e) { console.error('[MOB] Indices load error:', e); }
  }

  async function mobSyncMarketStatus() {
    try {
      const res = await fetch('/api/market-status');
      const s = await res.json();
      window._mobMarketOpen = s.anyOpen;
      const dotEu = document.getElementById('mob-dot-eu');
      const dotUs = document.getElementById('mob-dot-us');
      if (dotEu) { dotEu.className = 'mob-market-dot' + (s.euOpen ? ' live' : ''); }
      if (dotUs) { dotUs.className = 'mob-market-dot' + (s.usOpen ? ' live' : ''); }
    } catch(e) {}
  }

  async function mobLoadMovers() {
    try {
      const res = await fetch('/api/market/movers');
      const movers = await res.json();
      const container = document.getElementById('mob-movers-carousel');
      const section = document.getElementById('mob-movers-section');
      if (!container || !section) return;
      if (!movers || movers.length === 0) {
        section.style.display = 'none';
        return;
      }
      section.style.display = '';

              : '';
            const postVal = (m.postMarketChangePercent && Math.abs(m.postMarketChangePercent) > 0.01 && !window._mobMarketOpen)
              ? `<span style="color:${m.postMarketChangePercent >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)'}; font-weight:900; margin-right:4px">(${m.postMarketChangePercent >= 0 ? '+' : ''}${m.postMarketChangePercent.toFixed(1)}%)</span>`
              : '';

            return `
              <div class="snap-start shrink-0 w-28 bg-white dark:bg-surface-dark border-r border-slate-200 dark:border-slate-800 py-0.5 flex flex-col items-center justify-center text-center"
                   onclick="window.showMobDetails('${m.ticker}')">
                <span class="text-[11px] font-black text-black uppercase tracking-tight leading-none mb-1">${m.ticker}</span>

                  ${preVal || postVal}
                  <span style="color:${color}">${isPos ? '+' : ''}${m.changePercent.toFixed(1)}%</span>

              </div>`;

  }

  async function mobLoadAssets() {
    try {
      const res = await fetch('/api/assets');
      const assets = (await res.json()).filter(a => a.ticker !== 'CASH');
      
      const posContainer = document.getElementById('mob-list-positions');
      const posCountEl = document.getElementById('mob-pos-count');

      const openPos = assets.filter(a => a.hasPosition).sort((a, b) => (b.changePercent || 0) - (a.changePercent || 0));

      if (posCountEl) posCountEl.textContent = `${openPos.length} Assets`;

      const getAssetTag = (type, ticker) => {
        const t = (type || '').toUpperCase();
        const tk = (ticker || '').toUpperCase();
        if (tk.startsWith('CD_')) return 'CD';
        if (t.includes('ETF')) return 'ETF';
        if (t.includes('BOND') || t.includes('FIXED INCOME') || tk.startsWith('BTP')) return 'Bond';
        if (t.includes('EQUITY') || t.includes('AZIENDA') || t.includes('AZ')) return 'Az';
        return 'Az';
      };

      const renderCard = (a, isLarge = false) => {
        const price = a.currentPrice || 0;
        const change = a.changePercent || 0;
        const isPos = change >= 0;
        const color = isPos ? 'var(--mob-emerald)' : 'var(--mob-rose)';
        
        // Alert state
        const targetPrice = a.targetPrice || 0;
        const stopLoss = a.stopLoss || 0;
        const volThreshold = a.volatilityAlert || 0;

        const targetReached = targetPrice > 0 && price >= targetPrice;
        const stopLossHit = stopLoss > 0 && price <= stopLoss;

        let alertBg = '';
        let alertBorder = '';
        
        if (targetReached) {

              <span class="material-symbols-outlined">edit_note</span>
              <span>Modifica</span>
            </div>
          </div>
        ` : `
          <div class="mob-holding-actions">
            <div class="mob-action-btn bg-purple-ios" onclick="event.stopPropagation(); window.showMobDetails('${a.ticker.replace(/'/g, "\\'")}', '${a.name ? a.name.replace(/'/g, "\\'") : ''}', '${a.currency || 'EUR'}')">
              <span class="material-symbols-outlined">show_chart</span>
              <span>Grafico</span>
            </div>
            <div class="mob-action-btn bg-orange-ios" onclick="event.stopPropagation(); openManualModal('${a.ticker}', '${a.currency}', ${a.currentPrice}, '${a.type}', '${(a.country || '').replace(/'/g, "\\'")}', '${a.dataSource}', '${a.isin}')">
              <span class="material-symbols-outlined">edit_note</span>
              <span>Modifica</span>
            </div>
            <div class="mob-action-btn bg-red-ios" onclick="event.stopPropagation(); removeFromWatchlist(        const showLogo = _marketViewMode !== 'compact';
        const _chgVal = (a.changeValue || 0) * (a.totalQuantity || 0);
        const _showDailyGain = !showLogo && a.hasPosition && _chgVal !== 0;
        const _dgColor = _chgVal >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)';
        const _dgSign = _chgVal >= 0 ? '+' : '';

        return `
          <div class="mob-holding-swipe-container" 
               ontouchstart="handleTouchStart(event, this)" 
               ontouchmove="handleTouchMove(event, this)" 
               ontouchend="handleTouchEnd(event, this)">

                <div class="flex items-center gap-2">

                <div class="mob-holding-name">${abbreviateName(a.name) || ''}</div>

                <div class="flex items-center justify-end gap-1.5 mt-0.5">
                  ${(a.preMarketChangePercent && Math.abs(a.preMarketChangePercent) > 0.01 && !window._mobMarketOpen) ? `
                    <span style="font-size:10px; font-weight:900; color:${a.preMarketChangePercent >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)'}">
                      (${a.preMarketChangePercent >= 0 ? '+' : ''}${a.preMarketChangePercent.toFixed(1)}%)
                    </span>
                  ` : ''}
                  ${(a.postMarketChangePercent && Math.abs(a.postMarketChangePercent) > 0.01 && !window._mobMarketOpen) ? `
                    <span style="font-size:10px; font-weight:900; color:${a.postMarketChangePercent >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)'}">
                      (${a.postMarketChangePercent >= 0 ? '+' : ''}${a.postMarketChangePercent.toFixed(1)}%)
                    </span>
                  ` : ''}
                  <div class="mob-holding-gain" style="color:${color}; font-weight:900; margin-top:0">${isPos ? '+' : ''}${change.toFixed(1)}%</div>
                </div>
                ${_showDailyGain ? `<div style="font-size:10px; font-weight:900; color:${_dgColor}; text-align:right; margin-top:1px; letter-spacing:-0.2px">${_dgSign}${formatCurrency(_chgVal, a.currency, 0)}</div>` : ''}
              </div>
            </div>
          </div>`;
      };le="color:${color}; font-weight:900; margin-top:0">${isPos ? '+' : ''}${change.toFixed(1)}%</div>
                </div>
              </div>
            </div>
          </div>`;
      };


      if (posContainer) posContainer.innerHTML = openPos.map(a => renderCard(a, true)).join('') || '<div class="mob-empty">Nessuna posizione</div>';

    } catch(e) { console.error('[MOB] Market load error:', e); }
  }

  let _searchDebounce;
  window.mobSearchAssets = function(q) {
    const results = document.getElementById('mob-search-results');
    if (!q || q.length < 2) { results.classList.add('hidden'); return; }
    clearTimeout(_searchDebounce);
    _searchDebounce = setTimeout(async () => {
      try {
        const res = await fetch(`/api/asset-search?query=${encodeURIComponent(q)}`);
        const quotes = await res.json();
        if (quotes && quotes.length > 0) {
          results.innerHTML = quotes.map(q => `
            <div class="px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer border-b border-slate-100 dark:border-slate-800"
                 onclick="mobSelectAsset('${q.symbol}','${(q.shortname||q.longname||'').replace(/'/g,"\\'")}')">
              <div class="font-bold text-primary text-xs">${q.symbol}</div>
              <div class="text-[10px] text-slate-500 truncate">${q.shortname||q.longname}</div>
            </div>`).join('');
          results.classList.remove('hidden');
        }
      } catch(e) {}
    }, 300);
  };

  let _selectedTicker = '';
  let _selectedName = '';
  window.mobSelectAsset = function(ticker, name) {
    _selectedTicker = ticker;
    _selectedName = name;
    document.getElementById('mob-asset-search').value = ticker;
    document.getElementById('mob-search-results').classList.add('hidden');
  };

  window.mobQuickAdd = async function() {
    const ticker = _selectedTicker || document.getElementById('mob-asset-search').value.trim();
    if (!ticker) return;
    try {
      const res = await fetch('/api/assets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticker, name: _selectedName })
      });
      if (res.ok) {
        document.getElementById('mob-asset-search').value = '';
        _selectedTicker = ''; _selectedName = '';
        mobLoadAssets();
      }
    } catch(e) {}
  };


  function mobInit() {
    if (!window._mobileViewActive) return;
    mobSyncPrivacyIcon();
    mobSyncMarketStatus();
    mobLoadIndices();
    mobLoadMovers();
    mobLoadAssets();
    updateViewToggle();
  }

  window.addEventListener('mobile-view-activated', mobInit);
  document.addEventListener('DOMContentLoaded', () => { if (window._mobileViewActive) mobInit(); });
  window.addEventListener('privacy-changed', () => {
    mobSyncPrivacyIcon();
    if (window._mobileViewActive) mobLoadAssets();
  });
  window.addEventListener('market-data-updated', () => {
    if (window._mobileViewActive) mobLoadAssets();
  });
})();
</script>
</body>
</html>
