<script>
(function() {
  // ── Swipe Logic ──────────────────────────────────
  let touchStartX = 0;
  let touchMoveX = 0;
  let currentSwipeEl = null;
  const SWIPE_THRESHOLD = 50;
  const ACTION_WIDTH = 195; // 3 buttons * 65px

  window.handleTouchStart = function(e, container) {
    touchStartX = e.touches[0].clientX;
    touchMoveX = 0;
    if (currentSwipeEl && currentSwipeEl !== container) {
      resetSwipes(container);
    }
  };

  window.handleTouchMove = function(e, container) {
    const item = container.querySelector('.mob-holding-item');
    if (!item) return;
    touchMoveX = e.touches[0].clientX;
    let diff = touchMoveX - touchStartX;
    if (diff > 0) diff = 0;
    if (diff < -ACTION_WIDTH - 20) diff = -ACTION_WIDTH - 20;
    item.style.transition = 'none';
    item.style.transform = `translateX(${diff}px)`;
  };

  window.handleTouchEnd = function(e, container) {
    // If touch ended on an action button (or its child), do nothing here —
    // the button's own ontouchend handler will fire the action.
    if (e.target.closest('.mob-action-btn')) return;
    const item = container.querySelector('.mob-holding-item');
    if (!item) return;
    const diff = touchMoveX - touchStartX;
    
    item.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
    
    // If movement occurred and was beyond threshold, keep actions open.
    // Otherwise (including simple tap), reset to 0. (Tap-to-close)
    if (touchMoveX !== 0 && diff < -SWIPE_THRESHOLD) {
      item.style.transform = `translateX(-${ACTION_WIDTH}px)`;
      currentSwipeEl = container;
    } else {
      item.style.transform = 'translateX(0)';
      currentSwipeEl = null;
    }
  };

  // Handles action button taps reliably on mobile.
  // When the swipe panel is open, browsers suppress the synthetic 'click'
  // event because touchmove was recorded on the parent. We bypass this by
  // attaching ontouchend directly on each button which calls the action and
  // then resets the swipe state.
  window.mobActionTap = function(e, fn) {
    e.stopPropagation();
    e.preventDefault();
    // Reset swipe state so the row closes after the action
    const container = e.target.closest('.mob-holding-swipe-container');
    if (container) {
      const item = container.querySelector('.mob-holding-item');
      if (item) {
        item.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
        item.style.transform = 'translateX(0)';
      }
      currentSwipeEl = null;
    }
    // Small delay so the reset animation starts before the modal opens
    setTimeout(fn, 60);
  };

  function resetSwipes(except) {
    document.querySelectorAll('.mob-holding-swipe-container').forEach(c => {
      if (c === except) return;
      const item = c.querySelector('.mob-holding-item');
      if (item) item.style.transform = 'translateX(0)';
    });
    currentSwipeEl = null;
  }

  // ── View Mode (Normal / Compact) ────────────────────────────────────────
  let _marketViewMode = localStorage.getItem('market_view_mode') || 'normal';

  window.setMarketView = function(mode) {
    _marketViewMode = mode;
    localStorage.setItem('market_view_mode', mode);
    updateViewToggle();
    mobLoadAssets();
  };

  function updateViewToggle() {
    const btnN = document.getElementById('btn-view-normal');
    const btnC = document.getElementById('btn-view-compact');
    const isCompact = _marketViewMode === 'compact';
    if (btnN) btnN.className = isCompact
      ? 'p-1 rounded-md transition-all text-slate-400 dark:text-slate-500'
      : 'p-1 rounded-md transition-all bg-white dark:bg-slate-700 text-primary shadow-sm';
    if (btnC) btnC.className = isCompact
      ? 'p-1 rounded-md transition-all bg-white dark:bg-slate-700 text-primary shadow-sm'
      : 'p-1 rounded-md transition-all text-slate-400 dark:text-slate-500';
  }

  window.mobViewAssetDetails = function(ticker, name, currency) {
    // Consistent with other pages, we open the chart
    if (typeof openAssetChartModal === 'function') {
        openAssetChartModal(ticker, name, currency);
    }
  };
  window.showMobDetails = window.mobViewAssetDetails;

  // Abbreviates long asset names for compact display
  function abbreviateName(name, maxLen = 22) {
    if (!name) return '';
    // Remove common legal suffixes
    name = name
      .replace(/\b(Incorporated|Corporation|Limited|Company|Group)\b/gi, '')
      .replace(/\b(Inc\.|Corp\.|Ltd\.|Co\.|S\.p\.A\.|N\.V\.|PLC|S\.A\.|GmbH|AG|LLC|LP|SE|ASA|AB)\b/gi, '')
      .replace(/\b(UCITS|Accumulating|Distributing|Acc\.|Dist\.|ETF Fund|SICAV)\b/gi, '')
      .replace(/[,\s.]+$/, '')
      .replace(/\s{2,}/g, ' ')
      .trim();
    if (name.length > maxLen) name = name.substring(0, maxLen).trim() + '\u2026';
    return name;
  }

  // Formats price with currency symbol at the end: "182€", "42,3$", "4,87£"
  function fmtPriceCompact(price, currency, dec) {
    const sym = currency === 'USD' ? '$' : currency === 'GBP' ? '£' : '€';
    const n = price.toLocaleString('it-IT', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    return n + sym;
  }

  window.mobViewAssetTransactions = function(ticker) {
    // Navigate to portfolio detail and auto-filter transactions
    // Since we don't know the portfolio ID from here easily, 
    // we can either search for it or just show a message.
    // For now, let's just navigate to the FIRST portfolio that has this asset.
    fetch(`/api/assets/${ticker}/portfolios`).then(r => r.json()).then(data => {
        if (data && data.length > 0) {
            window.location.href = `/portfolio?id=${data[0].id}&ticker=${ticker}`;
        }
    });
  };

  function mobSyncPrivacyIcon() {
    const icon = document.getElementById('mob-privacy-icon');
    if (icon) icon.innerText = window.privacyState?.enabled ? 'visibility_off' : 'visibility';
  }

  async function mobLoadIndices() {
    try {
      const res = await fetch('/api/market/indices');
      const data = await res.json();
      const content = document.getElementById('mob-indices-content');
      if (!content || !data.length) return;
      
      const html = data.map(idx => {
        const isPos = idx.changePercent >= 0;
        const color = isPos ? 'var(--mob-emerald)' : 'var(--mob-rose)';
        const sign = isPos ? '+' : '';
        const price = (idx.price || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
        const change = (idx.changePercent || 0).toFixed(1);
        return `
          <div class="ticker-item">
            <span class="ticker-name">${idx.name}</span>
            <span class="ticker-price">${price}</span>
            <span style="color:${color}; font-weight:900">${sign}${change}%</span>
          </div>
        `;
      }).join('');
      
      // Double the items for a perfect seamless loop with -50% translation
      content.innerHTML = html + html;
    } catch(e) { console.error('[MOB] Indices load error:', e); }
  }

  async function mobSyncMarketStatus() {
    try {
      const res = await fetch('/api/market-status');

      const dotEu = document.getElementById('mob-dot-eu');

      if (dotUs) { dotUs.className = 'mob-market-dot' + (s.usOpen ? ' live' : ''); }
    } catch(e) {}
  }

  async function mobLoadMovers() {
    try {
      const res = await fetch('/api/market/movers');
      const movers = await res.json();
      const container = document.getElementById('mob-movers-carousel');
      const section = document.getElementById('mob-movers-section');
      if (!container || !section) return;
      if (!movers || movers.length === 0) {
        section.style.display = 'none';
        return;
      }
      section.style.display = '';
            const preVal = (m.preMarketChangePercent && Math.abs(m.preMarketChangePercent) > 0.01 && !window._mobMarketOpen) 
              ? `<span style="color:${m.preMarketChangePercent >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)'}; font-weight:900; margin-right:4px">(${m.preMarketChangePercent >= 0 ? '+' : ''}${m.preMarketChangePercent.toFixed(1)}%)</span>` 
              : '';
            const postVal = (m.postMarketChangePercent && Math.abs(m.postMarketChangePercent) > 0.01 && !window._mobMarketOpen)
              ? `<span style="color:${m.postMarketChangePercent >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)'}; font-weight:900; margin-right:4px">(${m.postMarketChangePercent >= 0 ? '+' : ''}${m.postMarketChangePercent.toFixed(1)}%)</span>`

            return `
              <div class="snap-start shrink-0 w-28 bg-white dark:bg-surface-dark border-r border-slate-200 dark:border-slate-800 py-0.5 flex flex-col items-center justify-center text-center"
                   onclick="window.showMobDetails('${m.ticker}')">

  async function mobLoadAssets() {
    try {
      const res = await fetch('/api/assets');
      const assets = (await res.json()).filter(a => a.ticker !== 'CASH');
      
      const posContainer = document.getElementById('mob-list-positions');
      const posCountEl = document.getElementById('mob-pos-count');

      const openPos = assets.filter(a => a.hasPosition).sort((a, b) => (b.changePercent || 0) - (a.changePercent || 0));

      if (posCountEl) posCountEl.textContent = `${openPos.length} Assets`;

      const getAssetTypeColors = (type, ticker) => {
        const t = (type || '').toUpperCase();
        const tk = (ticker || '').toUpperCase();
        
        let bg = 'rgba(239, 68, 68, 0.15)';
        let text = '#ef4444';
        let border = 'rgba(239, 68, 68, 0.3)';
        
        if (t.includes('MONETAR') || tk.includes('XEON') || tk.includes('LEON') || tk.includes('C3M') || tk.includes('SMART') || t.includes('CASH') || t.includes('LIQUIDIT') || t.includes('LIQUIDITY')) {
          bg = 'rgba(34, 197, 94, 0.15)';
          text = '#22c55e';
          border = 'rgba(34, 197, 94, 0.3)';
        } else if (t.includes('BOND') || t.includes('OBBLIG') || t.includes('DEPOSITO') || tk.startsWith('BTP') || t.includes('FIXED INCOME')) {
          bg = 'rgba(245, 158, 11, 0.15)';
          text = '#f59e0b';
          border = 'rgba(245, 158, 11, 0.3)';
        } else if (t.includes('ETF')) {
          bg = 'rgba(59, 130, 246, 0.15)';
          text = '#3b82f6';
          border = 'rgba(59, 130, 246, 0.3)';
        } else if (t.includes('CRYPTO') || t.includes('VALUTA')) {
          bg = 'rgba(139, 92, 246, 0.15)';
          text = '#8b5cf6';
          border = 'rgba(139, 92, 246, 0.3)';
        }
        
        return { bg, text, border };
      };

      const renderCard = (a, isLarge = false) => {
        const price = a.currentPrice || 0;
        const change = a.changePercent || 0;
        const isPos = change >= 0;
        const color = isPos ? 'var(--mob-emerald)' : 'var(--mob-rose)';
        
        // Alert state
        const targetPrice = a.targetPrice || 0;
        const stopLoss = a.stopLoss || 0;
        const volThreshold = a.volatilityAlert || 0;

        const targetReached = targetPrice > 0 && price >= targetPrice;
        const stopLossHit = stopLoss > 0 && price <= stopLoss;
        const volAlertTriggered = volThreshold > 0 && Math.abs(change) >= volThreshold;
        
        let alertBg = '';
        let alertBorder = '';
        
        if (targetReached) {
            alertBg = 'background: linear-gradient(rgba(16,185,129,0.12), rgba(16,185,129,0.12)), var(--mob-surface)';
            alertBorder = 'border-color: rgba(16,185,129,0.3) !important';
        } else if (stopLossHit) {
            alertBg = 'background: linear-gradient(rgba(244,63,94,0.12), rgba(244,63,94,0.12)), var(--mob-surface)';
            alertBorder = 'border-color: rgba(244,63,94,0.3) !important';
        } else if (volAlertTriggered) {
            alertBg = 'background: linear-gradient(rgba(245,158,11,0.12), rgba(245,158,11,0.12)), var(--mob-surface)';
            alertBorder = 'border-color: rgba(245,158,11,0.3) !important';
        }

        const colors = getAssetTypeColors(a.type || a.yfType, a.ticker);

        const tickerEsc = a.ticker.replace(/'/g, "\\'");
        const actions = a.hasPosition ? `
          <div class="mob-holding-actions">
            <div class="mob-action-btn bg-indigo-500"
                 ontouchend="mobActionTap(event, () => openAssetAiHistoryModal('${tickerEsc}'))"
                 onclick="event.stopPropagation(); openAssetAiHistoryModal('${tickerEsc}')">
              <span class="material-symbols-outlined text-white">smart_toy</span>
              <span class="text-white">IA</span>
            </div>
            <div class="mob-action-btn bg-blue-ios"
                 ontouchend="mobActionTap(event, () => mobViewAssetTransactions('${tickerEsc}'))"
                 onclick="event.stopPropagation(); mobViewAssetTransactions('${tickerEsc}')">
              <span class="material-symbols-outlined">list</span>
              <span>Trans</span>
            </div>
            <div class="mob-action-btn bg-orange-ios"
                 ontouchend="mobActionTap(event, () => openManualModal('${tickerEsc}', '${a.currency}', ${a.currentPrice}, '${a.type}', '${(a.country || '').replace(/'/g, "\\'").replace(/"/g, '&quot;')}', '${a.dataSource}', '${a.isin}'))"
                 onclick="event.stopPropagation(); openManualModal('${tickerEsc}', '${a.currency}', ${a.currentPrice}, '${a.type}', '${(a.country || '').replace(/'/g, "\\'").replace(/"/g, '&quot;')}', '${a.dataSource}', '${a.isin}')">
              <span class="material-symbols-outlined">edit_note</span>
              <span>Modifica</span>
            </div>
          </div>
        ` : `
          <div class="mob-holding-actions">
            <div class="mob-action-btn bg-indigo-500"
                 ontouchend="mobActionTap(event, () => openAssetAiHistoryModal('${tickerEsc}'))"
                 onclick="event.stopPropagation(); openAssetAiHistoryModal('${tickerEsc}')">
              <span class="material-symbols-outlined text-white">smart_toy</span>
              <span class="text-white">IA</span>
            </div>
            <div class="mob-action-btn bg-orange-ios"
                 ontouchend="mobActionTap(event, () => openManualModal('${tickerEsc}', '${a.currency}', ${a.currentPrice}, '${a.type}', '${(a.country || '').replace(/'/g, "\\'").replace(/"/g, '&quot;')}', '${a.dataSource}', '${a.isin}'))"
                 onclick="event.stopPropagation(); openManualModal('${tickerEsc}', '${a.currency}', ${a.currentPrice}, '${a.type}', '${(a.country || '').replace(/'/g, "\\'").replace(/"/g, '&quot;')}', '${a.dataSource}', '${a.isin}')">
              <span class="material-symbols-outlined">edit_note</span>
              <span>Modifica</span>
            </div>
            <div class="mob-action-btn bg-red-ios"
                 ontouchend="mobActionTap(event, () => removeFromWatchlist('${tickerEsc}', ${!!a.hasPosition}))"
                 onclick="event.stopPropagation(); removeFromWatchlist('${tickerEsc}', ${!!a.hasPosition})">
              <span class="material-symbols-outlined">delete</span>
              <span>Rimuovi</span>
            </div>
          </div>
        `;
        const showLogo = _marketViewMode !== 'compact';
        const _chgVal = (a.changeValue || 0) * (a.totalQuantity || 0);
        const _showDailyGain = !showLogo && a.hasPosition && _chgVal !== 0;
        const _dgColor = _chgVal >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)';
        const _dgSign = _chgVal >= 0 ? '+' : '';
        // Total position values
        const _totalVal = (a.currentPrice || 0) * (a.totalQuantity || 0);
        const _totalGain = a.totalGainEUR !== undefined ? a.totalGainEUR : (_totalVal - (a.totalCostAssetCurr || 0));
        const _totalGainCurrency = a.totalGainEUR !== undefined ? 'EUR' : a.currency;
        const _totGainIsPos = _totalGain >= 0;
        const _totGainColor = _totGainIsPos ? 'var(--mob-emerald)' : 'var(--mob-rose)';
        const _totGainSign = (_totGainIsPos && Math.abs(_totalGain) >= 0.5) ? '+' : '';
        const _showTotals = !showLogo && a.hasPosition && _totalVal > 0;

        return `
          <div class="mob-holding-swipe-container" 
               ontouchstart="handleTouchStart(event, this)" 
               ontouchmove="handleTouchMove(event, this)" 
               ontouchend="handleTouchEnd(event, this)">
            ${actions}
            <div class="mob-holding-item" style="${alertBg}; ${alertBorder}" onclick="window.showMobDetails('${a.ticker.replace(/'/g, "\\'")}', '${a.name ? a.name.replace(/'/g, "\\'") : ''}', '${a.currency || 'EUR'}')">
              <div class="mob-holding-info">
                <div class="flex items-center gap-2">
                  <div class="px-2 py-0.5 rounded-md text-[10px] font-black uppercase tracking-wider border" style="background: ${colors.bg}; color: #000000; border-color: ${colors.border}; display: inline-block;">${a.ticker}</div>
                  ${a.aiAction ? `
                    <div class="px-1.5 py-0.5 rounded text-[8px] font-black uppercase tracking-tighter border flex items-center gap-1
                        ${a.aiAction === 'BUY' || a.aiAction === 'INCREASE' ? 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20' : 
                          a.aiAction === 'SELL' || a.aiAction === 'DECREASE' ? 'bg-rose-500/10 text-rose-500 border-rose-500/20' : 
                          'bg-slate-500/10 text-slate-500 border-slate-500/20'}">
                        <span class="material-symbols-outlined text-[10px]">smart_toy</span> ${a.aiAction}
                    </div>` : ''}
                </div>
                <div class="mob-holding-name" style="margin-top:2px;">${abbreviateName(a.name) || ''}</div>
                <div class="flex flex-wrap gap-1.5 mt-1">
                    ${targetPrice > 0 ? `<div style="font-size:10px; font-weight:900; color:${targetReached?'var(--mob-emerald)':'var(--mob-text-caption)'}; display:flex; align-items:center; gap:2px"><span class="material-symbols-outlined" style="font-size:12px">${targetReached?'check_circle':'target'}</span> TP: ${formatCurrency(targetPrice, a.currency, 2)}</div>` : ''}
                    ${volThreshold > 0 ? `<div style="font-size:10px; font-weight:900; color:${volAlertTriggered?'var(--mob-amber)':'var(--mob-text-caption)'}; display:flex; align-items:center; gap:2px"><span class="material-symbols-outlined" style="font-size:12px">${volAlertTriggered?'priority_high':'bolt'}</span> VOL: ${volThreshold}%</div>` : ''}
                    ${stopLoss > 0 ? `<div style="font-size:10px; font-weight:900; color:${stopLossHit?'var(--mob-rose)':'var(--mob-text-caption)'}; display:flex; align-items:center; gap:2px"><span class="material-symbols-outlined" style="font-size:12px">${stopLossHit?'dangerous':'warning'}</span> SL: ${formatCurrency(stopLoss, a.currency, 2)}</div>` : ''}
                </div>
              </div>
              <div class="mob-holding-values">
                ${showLogo ? `
                  <div class="mob-holding-value">${formatCurrency(price, a.currency, price >= 100 ? 0 : price >= 10 ? 1 : 2)}</div>
                  <div class="flex items-center justify-end gap-1.5 mt-0.5">
                    ${(a.preMarketChangePercent && Math.abs(a.preMarketChangePercent) > 0.01 && !window._mobMarketOpen) ? `<span style="font-size:10px; font-weight:900; color:${a.preMarketChangePercent >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)'}">(${a.preMarketChangePercent >= 0 ? '+' : ''}${a.preMarketChangePercent.toFixed(1)}%)</span>` : ''}
                    ${(a.postMarketChangePercent && Math.abs(a.postMarketChangePercent) > 0.01 && !window._mobMarketOpen) ? `<span style="font-size:10px; font-weight:900; color:${a.postMarketChangePercent >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)'}">(${a.postMarketChangePercent >= 0 ? '+' : ''}${a.postMarketChangePercent.toFixed(1)}%)</span>` : ''}
                    <div class="mob-holding-gain" style="color:${color}; font-weight:900; margin-top:0">${isPos ? '+' : ''}${change.toFixed(1)}%</div>
                  </div>
                ` : `
                  <div class="mob-compact-values">
                    <span class="mob-cv-gain" style="color:${_dgColor}">${_showDailyGain ? _dgSign + fmtPriceCompact(_chgVal, a.currency, 0) : ''}</span>
                    <span class="mob-holding-gain" style="color:${color}; font-weight:900; margin-top:0">${isPos ? '+' : ''}${change.toFixed(1)}%</span>
                    <span class="mob-holding-value">${fmtPriceCompact(price, a.currency, price >= 100 ? 0 : price >= 10 ? 1 : 2)}</span>
                  </div>
                  ${_showTotals ? `<div class="mob-compact-values" style="margin-top:2px; opacity:0.85">
                    <span style="display:inline-flex; justify-content:flex-end; padding-right:6px"><span style="background:${_totGainIsPos ? 'rgba(16,185,129,0.15)' : 'rgba(244,63,94,0.15)'}; color:${_totGainColor}; font-size:calc(11px * var(--mob-scale,1)); font-weight:700; white-space:nowrap; border-radius:4px; padding:1px 5px; letter-spacing:-0.2px">${_totGainSign}${fmtPriceCompact(_totalGain, _totalGainCurrency, 0)}</span></span>
                    <span></span>
                    <span style="text-align:right; font-size:calc(11px * var(--mob-scale,1)); font-weight:500; color:var(--mob-text-muted); white-space:nowrap; padding-left:8px">${fmtPriceCompact(_totalVal, a.currency, 0)}</span>
                  </div>` : ''}
                `}
              </div>
            </div>
          </div>`;
      };





      if (posContainer) posContainer.innerHTML = openPos.map(a => renderCard(a, true)).join('') || '<div class="mob-empty">Nessuna posizione</div>';

    } catch(e) { console.error('[MOB] Market load error:', e); }
  }

  let _searchDebounce;
  window.mobSearchAssets = function(q) {
    const results = document.getElementById('mob-search-results');
    if (!q || q.length < 2) { results.classList.add('hidden'); return; }
    clearTimeout(_searchDebounce);
    _searchDebounce = setTimeout(async () => {
      try {
        const res = await fetch(`/api/asset-search?query=${encodeURIComponent(q)}`);
        const quotes = await res.json();
        if (quotes && quotes.length > 0) {
          results.innerHTML = quotes.map(q => `
            <div class="px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer border-b border-slate-100 dark:border-slate-800"
                 onclick="mobSelectAsset('${q.symbol}','${(q.shortname||q.longname||'').replace(/'/g,"\\'")}')">
              <div class="font-bold text-primary text-xs">${q.symbol}</div>
              <div class="text-[10px] text-slate-500 truncate">${q.shortname||q.longname}</div>
            </div>`).join('');
          results.classList.remove('hidden');
        }
      } catch(e) {}
    }, 300);
  };

  let _selectedTicker = '';
  let _selectedName = '';
  window.mobSelectAsset = function(ticker, name) {
    _selectedTicker = ticker;
    _selectedName = name;
    document.getElementById('mob-asset-search').value = ticker;
    document.getElementById('mob-search-results').classList.add('hidden');
  };

  window.mobQuickAdd = async function() {
    const ticker = _selectedTicker || document.getElementById('mob-asset-search').value.trim();
    if (!ticker) return;
    try {
      const res = await fetch('/api/assets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticker, name: _selectedName })
      });
      if (res.ok) {
        document.getElementById('mob-asset-search').value = '';
        _selectedTicker = ''; _selectedName = '';
        mobLoadAssets();
      }
    } catch(e) {}
  };

  // ─── AI Analysis Modals & Logic ────────────────────────────────────────────────────────
  window.runAssetAI = async function(ticker) {
      const overlay = document.getElementById('ai-loading-overlay');
      const msgEl = document.getElementById('ai-loading-msg');
      overlay.classList.remove('hidden');
      overlay.style.display = 'flex';
      msgEl.innerText = 'Inizializzazione...';

      const source = new EventSource('/api/assets/' + encodeURIComponent(ticker) + '/ai-analysis');
      source.addEventListener('progress', function(e) {
          const data = JSON.parse(e.data);
          msgEl.innerText = data.message;
      });
      source.addEventListener('complete', function(e) {
          source.close();
          overlay.classList.add('hidden');
          overlay.style.display = '';
          mobLoadAssets();
      });
      source.addEventListener('error', function(e) {
          source.close();
          overlay.classList.add('hidden');
          overlay.style.display = '';
          const data = JSON.parse(e.data || '{}');
          alert(data.error || "Errore durante l'analisi IA");
      });
  }

  window.openAssetAiHistoryModal = function(ticker) {
      document.getElementById('history-modal-ticker').innerText = ticker;
      document.getElementById('asset-ai-history-modal').classList.remove('hidden');
      document.getElementById('btn-run-new-ai').onclick = () => {
          closeAssetAiHistoryModal();
          runAssetAI(ticker);
      };
      loadAssetAiHistory(ticker);
  }

  window.closeAssetAiHistoryModal = function() {
      document.getElementById('asset-ai-history-modal').classList.add('hidden');
  }

  window.loadAssetAiHistory = async function(ticker) {
      const listEl = document.getElementById('asset-ai-history-list');
      listEl.innerHTML = '<div class="flex justify-center p-8"><span class="material-symbols-outlined animate-spin text-slate-400 text-3xl">sync</span></div>';
      
      try {
          const res = await fetch('/api/assets/' + encodeURIComponent(ticker) + '/ai-history');
          const history = await res.json();
          
          if (!history || history.length === 0) {
              listEl.innerHTML = '<div class="text-center py-12 text-slate-500 italic">Nessuna analisi passata presente.</div>';
              return;
          }

          listEl.innerHTML = history.map(item => {
              const date = new Date(item.created_at).toLocaleString();
              const actionColor = item.action === 'BUY' || item.action === 'INCREASE' ? 'text-emerald-500 bg-emerald-500/10 border-emerald-500/20' : 
                                  item.action === 'SELL' || item.action === 'DECREASE' ? 'text-rose-500 bg-rose-500/10 border-rose-500/20' : 
                                  'text-slate-500 bg-slate-500/10 border-slate-500/20';
              
              return `
                  <div class="border border-slate-200 dark:border-slate-800 rounded-xl p-4 bg-slate-50 dark:bg-slate-800/50 mb-3">
                      <div class="flex justify-between items-center mb-2">
                          <span class="font-bold text-slate-500 flex items-center gap-1 text-[11px]">
                              <span class="material-symbols-outlined text-[14px]">calendar_today</span> ${date}
                          </span>
                          <div class="flex items-center gap-2">
                              <span class="px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-widest border ${actionColor}">${item.action}</span>
                              <button onclick="deleteAssetAiHistory(${item.id}, '${ticker}')" class="text-rose-500"><span class="material-symbols-outlined text-sm">delete</span></button>
                          </div>
                      </div>
                      <div class="flex gap-4 mb-3 text-[10px] font-bold text-slate-400">
                          ${item.targetPrice ? `<span>TP: <span class="text-emerald-500">${item.targetPrice}</span></span>` : ''}
                          ${item.stopLoss ? `<span>SL: <span class="text-rose-500">${item.stopLoss}</span></span>` : ''}
                      </div>
                      <div class="text-xs text-slate-600 dark:text-slate-400 line-clamp-3 mb-3">${item.reasoning.replace(/\\n/g, ' ')}</div>
                      <button onclick="openAssetAiModal('${ticker}', '${item.action}', \`${(item.reasoning || '').replace(/`/g, '\\`').replace(/'/g, "\\'").replace(/"/g, '&quot;')}\`, '${date}')" class="text-[10px] font-bold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 shadow-sm w-full">Leggi Tutto</button>
                  </div>
              `;
          }).join('');
      } catch(e) {
          listEl.innerHTML = '<div class="text-center py-4 text-rose-500 font-bold">Errore di caricamento</div>';
      }
  }

  window.deleteAssetAiHistory = async function(id, ticker) {
      if (!confirm('Eliminare analisi?')) return;
      try {
          const res = await fetch('/api/assets/ai-history/' + id, { method: 'DELETE' });
          if((await res.json()).success) loadAssetAiHistory(ticker);
      } catch(e) {}
  }

  window.openAssetAiModal = function(ticker, action, reasoning, date) {
      document.getElementById('asset-ai-ticker').innerText = ticker;
      const actionEl = document.getElementById('asset-ai-action');
      actionEl.innerText = action;
      actionEl.className = `inline-block px-3 py-1 rounded-lg text-xs font-black uppercase tracking-widest border ${
          action === 'BUY' || action === 'INCREASE' ? 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20' : 
          action === 'SELL' || action === 'DECREASE' ? 'bg-rose-500/10 text-rose-500 border-rose-500/20' : 
          'bg-slate-500/10 text-slate-500 border-slate-500/20'
      }`;
      document.getElementById('asset-ai-reasoning').innerHTML = reasoning.replace(/\\n/g, '<br>');
      document.getElementById('asset-ai-date').innerText = 'Aggiornato il: ' + date;
      document.getElementById('asset-ai-modal').classList.remove('hidden');
  }

  window.closeAssetAiModal = function() {
      document.getElementById('asset-ai-modal').classList.add('hidden');
  }



  function mobInit() {
    if (!window._mobileViewActive) return;
    mobSyncPrivacyIcon();
    mobSyncMarketStatus();
    mobLoadIndices();
    mobLoadMovers();
    mobLoadAssets();
    updateViewToggle();
  }

  window.addEventListener('mobile-view-activated', mobInit);
  document.addEventListener('DOMContentLoaded', () => { if (window._mobileViewActive) mobInit(); });
  window.addEventListener('privacy-changed', () => {
    mobSyncPrivacyIcon();
    if (window._mobileViewActive) mobLoadAssets();
  });
  window.addEventListener('market-data-updated', () => {
    if (window._mobileViewActive) mobLoadAssets();
  });
})();
</script>
</body>
</html>
