<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>M2T - History</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M2T">
<link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/dist/output.css">
    <link rel="stylesheet" href="/mobile.css?v=1780588387886">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
    <script src="/theme.js"></script>
    <script src="/transaction_modal.js"></script>
    <script src="/mobile_transactions.js"></script>
    <script src="/auth.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.ftAuth) ftAuth.initAuthGuard();
        });
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex mobile-view-active">
<div id="mobile-ui">
  <!-- ── Mobile Header ── -->
  <div class="mob-header">
    <img src="/m2t_mobile_logo_dark.png" style="width:96px;height:48px;border-radius:4px;object-fit:cover;object-position:center;margin-right:8px;" alt="M2T Logo">
    
    <div class="mob-header-market-pill">
      <div class="mob-market-item">
        <span>EU</span>
        <span id="mob-dot-eu" class="mob-market-dot"></span>
      </div>
    <div style="flex:1"></div>
      <div class="mob-market-item">
        <span>US</span>
        <span id="mob-dot-us" class="mob-market-dot"></span>
      </div>
    </div>
    <div id="mob-header-var-day" class="mob-header-var-pill">--</div>
    <div class="mob-header-actions">
      <a href="/admin" id="mob-admin-link" class="mob-icon-btn text-amber-500" title="Admin Panel" style="display:none">
        <span class="material-symbols-outlined">admin_panel_settings</span>
      </a>
      <a href="/notifications" class="mob-icon-btn relative" title="Notifications">
        <span class="material-symbols-outlined">notifications</span>
        <span id="mob-notification-badge" class="mob-badge" style="display: none;">0</span>
      </a>
      <a href="/settings" class="mob-icon-btn" title="Settings">
        <span class="material-symbols-outlined">settings</span>
      </a>
    </div>
  </div>

  <!-- Page Title -->
  <div class="mob-header-title-container px-4 py-2">
    <div class="text-[10px] font-black uppercase tracking-widest text-slate-500 opacity-70">Trading History</div>
    <div class="text-xl font-black">Closed Positions</div>
  </div>

  <!-- ── Scrollable Content ── -->
  <div class="mob-scroll" id="mob-history-scroll">
    <div class="mob-portfolio-list" id="mob-history-list">
      <div style="text-align:center;padding:24px">
        <div class="mob-spinner" style="margin:0 auto"></div>
      </div>
    </div>
    <div style="height: 20px"></div>
  </div>

  <!-- ── Bottom Tab Bar ── -->
  <div class="mob-tab-bar">
    <a href="/dashboard" class="mob-tab-item">
      <span class="material-symbols-outlined">dashboard</span>
    </a>
    <a href="/market" class="mob-tab-item">
      <span class="material-symbols-outlined">trending_up</span>
    </a>
    <a href="/watchlist" class="mob-tab-item">
      <span class="material-symbols-outlined">visibility</span>
    </a>
    <a href="/history" class="mob-tab-item active">
      <span class="material-symbols-outlined">history</span>
    </a>
    <a href="/dividend" class="mob-tab-item">
      <span class="material-symbols-outlined">payments</span>
    </a>
    <a href="/reports" class="mob-tab-item">
      <span class="material-symbols-outlined">pie_chart</span>
    </a>
    <a href="/notes" class="mob-tab-item">
      <span class="material-symbols-outlined">note_stack</span>
    </a>
  </div>
</div>

<script>
    const getAssetTypeColors = (type, ticker) => {
        const t = (type || '').toUpperCase();
        const tk = (ticker || '').toUpperCase();
        
        let bg = 'rgba(239, 68, 68, 0.15)';
        let text = '#ef4444';
        let border = 'rgba(239, 68, 68, 0.3)';
        
        if (t.includes('LIQUID') || t.includes('CASH') || tk.includes('CASH')) {
            bg = 'rgba(22, 101, 52, 0.15)'; text = '#166534'; border = 'rgba(22, 101, 52, 0.3)'; // Verde Scuro
        } else if (t.includes('DEPOSITO') || t.includes('CONTO')) {
            bg = 'rgba(21, 128, 61, 0.15)'; text = '#15803d'; border = 'rgba(21, 128, 61, 0.3)'; // Verde Medio
        } else if (t.includes('MONETARIO') || tk.includes('XEON') || tk.includes('LEON') || tk.includes('C3M') || tk.includes('SMART')) {
            bg = 'rgba(74, 222, 128, 0.15)'; text = '#4ade80'; border = 'rgba(74, 222, 128, 0.3)'; // Verde Chiaro
        } else if (t.includes('BOND') || t.includes('OBBLIG') || tk.startsWith('BTP') || t.includes('FIXED INCOME')) {
            bg = 'rgba(234, 179, 8, 0.15)'; text = '#eab308'; border = 'rgba(234, 179, 8, 0.3)'; // Giallo
        } else if (t.includes('ETF AZION') || t.includes('ETF')) {
            bg = 'rgba(249, 115, 22, 0.15)'; text = '#f97316'; border = 'rgba(249, 115, 22, 0.3)'; // Arancio
        } else if (t.includes('CRYPTO') || t.includes('VALUTA')) {
            bg = 'rgba(139, 92, 246, 0.15)'; text = '#8b5cf6'; border = 'rgba(139, 92, 246, 0.3)'; // Viola
        } else if (t.includes('AZION') || t.includes('STOCK') || t.includes('EQUITY')) {
            bg = 'rgba(239, 68, 68, 0.15)'; text = '#ef4444'; border = 'rgba(239, 68, 68, 0.3)'; // Rosso
        }
        
        return { bg, text, border };
    };

    let rawHistoryData = [];
    let isMobDataLoaded = false;
    let mobCollapsedGroups = new Set();

    async function loadHistoryData() {
        try {
            const res = await fetch('/api/analytics/history');
            const data = await res.json();
            rawHistoryData = Array.isArray(data) ? data : [];
            
            const currentYear = new Date().getFullYear().toString();
            const years = [...new Set(rawHistoryData.map(d => d.year))];
            
            // Auto-collapse past years
            years.forEach(y => {
                if (y.toString() !== currentYear) {
                    mobCollapsedGroups.add('hist_' + y);
                }
            });
            
            isMobDataLoaded = true;
            renderMobileView();
        } catch (err) {
            console.error('Error loading history:', err);
            isMobDataLoaded = true; // Set true to remove spinner even on error
            renderMobileView();
        }
    }

    // ── Swipe Logic ──────────────────────────────────
    let touchStartX = 0;
    let touchMoveX = 0;
    let currentSwipeEl = null;
    const SWIPE_THRESHOLD = 50;
    const ACTION_WIDTH = 130; // 2 buttons * 65px

    window.handleTouchStart = function(e, container) {
        touchStartX = e.touches[0].clientX;
        touchMoveX = 0;
        if (currentSwipeEl && currentSwipeEl !== container) {
            resetSwipes(container);
        }
    };

    window.handleTouchMove = function(e, container) {
        const item = container.querySelector('.mob-holding-item');
        if (!item) return;
        touchMoveX = e.touches[0].clientX;
        let diff = touchMoveX - touchStartX;
        if (diff > 0) diff = 0;
        if (diff < -ACTION_WIDTH - 20) diff = -ACTION_WIDTH - 20;
        item.style.transition = 'none';
        item.style.transform = `translateX(${diff}px)`;
    };

    window.handleTouchEnd = function(e, container) {
        const item = container.querySelector('.mob-holding-item');
        if (!item) return;
        const diff = touchMoveX - touchStartX;
        item.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
        if (touchMoveX !== 0 && diff < -SWIPE_THRESHOLD) {
            item.style.transform = `translateX(-${ACTION_WIDTH}px)`;
            currentSwipeEl = container;
        } else {
            item.style.transform = 'translateX(0)';
            currentSwipeEl = null;
        }
    };

    function resetSwipes(except) {
        document.querySelectorAll('.mob-holding-swipe-container').forEach(c => {
            if (c === except) return;
            const item = c.querySelector('.mob-holding-item');
            if (item) item.style.transform = 'translateX(0)';
        });
        currentSwipeEl = null;
    }

    function mobToggleGroup(key) {
        if (mobCollapsedGroups.has(key)) {
            mobCollapsedGroups.delete(key);
        } else {
            mobCollapsedGroups.add(key);
        }
        renderMobileView();
    }

    function renderMobileView() {
        if (!isMobDataLoaded) return;
        const container = document.getElementById('mob-history-list');
        if (!container) return;

        // Group rawHistoryData by year
        const groups = {};
        rawHistoryData.forEach(pos => {
            const y = pos.year || 'Unknown';
            if (!groups[y]) groups[y] = { items: [], totalGain: 0, count: 0 };
            groups[y].items.push(pos);
            groups[y].totalGain += pos.realizedGain || 0;
            groups[y].count++;
        });
        
        const sortedYears = Object.keys(groups).sort((a,b) => b - a);
        let html = '';
        
        sortedYears.forEach(year => {
            const g = groups[year];
            const key = 'hist_' + year;
            const isCollapsed = mobCollapsedGroups.has(key);
            const colorRaw = g.totalGain >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)';
            const sign = g.totalGain >= 0 ? '+' : '';
            
            html += `
                <div class="mob-section-header" onclick="mobToggleGroup('${key}')" style="cursor:pointer">
                    <div class="mob-section-title flex items-center gap-2">
                        <span class="material-symbols-outlined" style="font-size: 20px;">${isCollapsed ? 'chevron_right' : 'expand_more'}</span>
                        ${year} <span style="font-size:11px; color:var(--mob-text-muted); font-weight:normal;">(${g.count})</span>
                    </div>
                    <div class="mob-section-link" style="color: ${colorRaw}; font-size: 18px; font-weight: 900;">
                        ${sign}${formatCurrency(g.totalGain, 'EUR', 0)}
                    </div>
                </div>
            `;
            
            if (!isCollapsed) {
                html += `<div class="mob-list-edge">`;
                g.items.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(pos => {
                    const isTrade = ['BUY', 'SELL'].includes(pos.type);
                    const gainColor = pos.realizedGain >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)';
                    const gainSign = pos.realizedGain >= 0 ? '+' : '';
                    const colors = getAssetTypeColors(pos.assetType, pos.ticker);
                    
                    html += `
                        <div class="mob-holding-swipe-container" 
                                ontouchstart="handleTouchStart(event, this)" 
                                ontouchmove="handleTouchMove(event, this)" 
                                ontouchend="handleTouchEnd(event, this)">
                            <div class="mob-holding-actions">
                                <div class="mob-action-btn bg-orange-ios" onclick="event.stopPropagation(); editTransaction('${pos.id}')">
                                    <span class="material-symbols-outlined">edit</span>
                                    <span>Modifica</span>
                                </div>
                                <div class="mob-action-btn bg-red-ios" onclick="event.stopPropagation(); confirmDeleteTransaction('${pos.id}')">
                                    <span class="material-symbols-outlined">delete</span>
                                    <span>Elimina</span>
                                </div>
                            </div>
                            <div class="mob-holding-item">
                                <div class="mob-holding-info">
                                    <div class="flex items-center gap-2">
                                        <div class="px-2 py-0.5 rounded-md text-[10px] font-black uppercase tracking-wider border" style="background: ${colors.bg}; color: #000000; border-color: ${colors.border}; display: inline-block;">${pos.ticker || pos.name}</div>
                                        <div class="px-1.5 py-0.5 rounded-md border text-[8px] font-black uppercase tracking-tighter ${pos.realizedGain >= 0 ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-500/20'}">${isTrade ? pos.type : 'CLOSED'}</div>
                                    </div>
                                    <div class="mob-holding-name" style="margin-top:2px;">${pos.portfolioName || 'N/A'} • ${isTrade ? formatNumber(pos.quantity, 0) + ' qta • PMC ' + formatCurrency(pos.pmc, 'EUR') + ' / ' + formatCurrency(pos.sellPrice, 'EUR') : pos.type}</div>
                                </div>
                                <div class="mob-holding-values">
                                    <div class="mob-holding-value" style="color: ${isTrade ? gainColor : 'inherit'}">
                                        ${isTrade ? gainSign + formatCurrency(pos.realizedGain, 'EUR', 0) : formatCurrency(pos.totalProceeds, 'EUR', 0)}
                                    </div>
                                    <div class="mob-holding-gain" style="color: var(--mob-text-muted); font-size: 11px;">
                                        Proceeds: ${formatCurrency(pos.totalProceeds, 'EUR', 0)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
        });
        container.innerHTML = html || '<div class="mob-empty"><span class="material-symbols-outlined">inbox</span><div class="mob-empty-title">No Closed Positions</div></div>';
    }

    window.editTransaction = function(id) {
        const t = rawHistoryData.find(tx => tx.id == id);
        if (t) mobileEditTransaction(t);
    };
    window.duplicateTransaction = function(id) {
        const t = rawHistoryData.find(tx => tx.id == id);
        if (t) mobileDuplicateTransaction(t);
    };
    window.confirmDeleteTransaction = function(id) {
        mobileDeleteTransaction(id);
    };

    window.addEventListener('privacy-changed', renderMobileView);
    document.addEventListener("DOMContentLoaded", () => {
        loadHistoryData();
        if (window.ftAuth && ftAuth.getUser()?.role === 'admin') {
            const adminLink = document.getElementById('mob-admin-link');
            if (adminLink) adminLink.style.display = 'flex';
        }
    });
</script>
</body>
</html>
