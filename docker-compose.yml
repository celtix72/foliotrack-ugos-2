services:
  foliotrack:
    build: .
    container_name: foliotrack
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./foliotrack.db:/app/foliotrack.db
      - ./foliotrack.db-shm:/app/foliotrack.db-shm
      - ./foliotrack.db-wal:/app/foliotrack.db-wal
    environment:
      - NODE_ENV=production
      - PORT=3000
