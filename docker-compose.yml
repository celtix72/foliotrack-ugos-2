services:
  foliotrack-2:
    # ─── Modalità produzione: scarica l'immagine pre-compilata da GitHub ─────────
    # L'immagine viene costruita automaticamente da GitHub Actions ad ogni push.
    image: ghcr.io/celtix72/foliotrack-ugos-2:latest
    container_name: foliotrack-2
    restart: unless-stopped
    networks:
      lan_static:
        ipv4_address: 192.168.178.211
    dns:
      - 192.168.178.1
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      # Solo i dati persistenti vengono montati dall'host.
      # Il codice è già nell'immagine scaricata da ghcr.io.
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - DB_PATH=/app/data/foliotrack.db
      - BACKUP_DIR=/app/data/backups
      - TZ=Europe/Rome
      - JWT_SECRET=${JWT_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/app-version', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lan_static:
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.168.178.0/24
          gateway: 192.168.178.1
