<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>M2T - Watchlist</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="M2T">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/dist/output.css">
    <link rel="stylesheet" href="/mobile.css">
    <script src="/theme.js"></script>
    <script src="/mobile_transactions.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .mob-perf-badge { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; border-width: 1px; }
        .mob-watchlist-item { background: var(--mob-bg-card); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--mob-border); }
        .mob-detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--mob-border); }
        .mob-detail-label { font-size: 10px; text-transform: uppercase; font-weight: 800; color: var(--mob-text-caption); }
        .mob-detail-value { font-size: 13px; font-weight: 800; }
        
        /* Force visibility of #mobile-ui when mobile view is active */
        body.mobile-view-active #mobile-ui { display: flex !important; visibility: visible !important; opacity: 1 !important; }
    </style>
</head>
<body class="bg-background-light dark:bg-[#0b0f1a] text-slate-900 dark:text-slate-100 min-h-screen flex mobile-view-active">

<div id="mobile-ui" class="flex flex-col h-screen w-full overflow-hidden">
    <!-- Header -->
    <div class="mob-header">
        <div class="mob-header-logo-container">
            <div class="mob-header-logo-circle">
                <span class="material-symbols-outlined">insights</span>
            </div>
            <div class="mob-header-logo-text">M2T</div>
        </div>

        <div style="flex:1"></div>

        <!-- EU / US Market Status Pill -->
        <div class="mob-header-market-pill">
            <div class="mob-market-item">
                <span>EU</span>
                <span id="mob-dot-eu" class="mob-market-dot"></span>
            </div>
            <div class="mob-market-item">
                <span>US</span>
                <span id="mob-dot-us" class="mob-market-dot"></span>
            </div>
        </div>

        <!-- Day Variation Pill -->
        <div id="mob-header-var-day" class="mob-header-var-pill">--</div>

        <!-- Action Buttons -->
        <div class="mob-header-actions">
            <a href="/notifications" class="mob-icon-btn relative" title="Notifications">
                <span class="material-symbols-outlined">notifications</span>
                <span id="mob-notification-badge" class="mob-badge" style="display: none;">0</span>
            </a>
            <a href="/settings" class="mob-icon-btn" title="Settings">
                <span class="material-symbols-outlined">settings</span>
            </a>
        </div>
    </div>

    <!-- Content -->
    <div class="mob-scroll p-4" id="mob-watchlist-scroll">
        <!-- Search -->
        <div class="relative mb-6">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400 text-sm">search</span>
            <input type="text" id="mob-asset-search" placeholder="Search ticker..." 
                   class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20">
            <div id="mob-search-suggestions" class="absolute top-full left-0 right-0 mt-2 bg-white dark:bg-[#111722] border border-slate-200 dark:border-slate-800 rounded-xl shadow-2xl z-[100] hidden overflow-hidden"></div>
        </div>

        <div id="mob-watchlist-container">
            <!-- Items injected here -->
        </div>

        <div id="mob-watchlist-empty" class="py-20 text-center hidden">
            <span class="material-symbols-outlined text-6xl text-slate-200 dark:text-slate-800 mb-4">visibility_off</span>
            <p class="text-slate-500 font-bold">Watchlist empty</p>
        </div>
        
        <div style="height: 80px"></div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="mob-tab-bar">
        <a href="/dashboard" class="mob-tab-item">
            <span class="material-symbols-outlined">dashboard</span>
        </a>
        <a href="/market" class="mob-tab-item">
            <span class="material-symbols-outlined">trending_up</span>
        </a>
        <a href="/watchlist" class="mob-tab-item active">
            <span class="material-symbols-outlined">visibility</span>
        </a>
        <a href="/dividend" class="mob-tab-item">
            <span class="material-symbols-outlined">payments</span>
        </a>
        <a href="/settings" class="mob-tab-item">
            <span class="material-symbols-outlined">settings</span>
        </a>
    </div>
</div>

<!-- Bottom Sheet Detail -->
<div id="mob-detail-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200]" style="display: none;" onclick="closeMobDetail()"></div>
<div id="mob-detail-sheet" class="fixed bottom-0 left-0 right-0 bg-white dark:bg-[#111722] rounded-t-3xl z-[201] transition-transform duration-300 pb-8 px-6 pt-2 shadow-2xl border-t border-slate-200 dark:border-slate-800" style="display: none; transform: translateY(100%);">
    <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full mx-auto mb-6"></div>
    <div class="flex justify-between items-start mb-6">
        <div>
            <h3 id="mob-modal-ticker" class="text-2xl font-black text-primary">AAPL</h3>
            <p id="mob-modal-name" class="text-sm text-slate-500 font-bold">Apple Inc.</p>
        </div>
        <div id="mob-modal-exchange" class="text-[10px] font-black uppercase tracking-widest bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded text-slate-500">NasdaqGS</div>
    </div>
    <div id="mob-asset-chart-container" class="bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-100 dark:border-slate-800 p-4 mb-6">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
                <div class="w-1.5 h-1.5 rounded-full bg-primary font-black"></div>
                <h4 class="text-[9px] font-black uppercase tracking-widest text-slate-400">1-Month Performance</h4>
            </div>
            <div id="mob-modal-perf-badge" class="px-2 py-0.5 rounded text-[9px] font-black shadow-sm"></div>
        </div>
        <div class="h-[140px] w-full relative">
            <canvas id="mob-asset-detail-chart"></canvas>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-x-4 gap-y-3" id="mob-modal-content">
        <!-- Details here -->
    </div>
</div>

<script>
    async function loadWatchlist() {
        console.log('Mobile: loadWatchlist starting...');
        try {
            const resW = await fetch('/api/watchlist');
            const data = await resW.json();
            window.watchlist = data;
            console.log('Mobile: Watchlist loaded:', window.watchlist.length, 'items');
            renderWatchlist();

            const resP = await fetch('/api/watchlist/performance');
            window.performanceData = await resP.json();
            console.log('Mobile: Performance data received');
            renderWatchlist();
        } catch (err) {
            console.error('Failed to load watchlist:', err);
        }
    }
    window.loadWatchlist = loadWatchlist;

    function renderWatchlist() {
        const container = document.getElementById('mob-watchlist-container');
        const empty = document.getElementById('mob-watchlist-empty');
        const watchlist = window.watchlist || [];
        const performanceData = window.performanceData || {};
        
        if (!watchlist || watchlist.length === 0) {
            if (container) container.innerHTML = '';
            if (empty) empty.classList.remove('hidden');
            return;
        }
        if (empty) empty.classList.add('hidden');

        // Categorize assets
        const equities = watchlist.filter(item => {
            const t = (item.type || '').toUpperCase();
            return t === 'AZIONI' || t === 'EQUITY' || t === 'STOCK' || t === 'COMMON STOCK';
        });
        const etfs = watchlist.filter(item => {
            const t = (item.type || '').toUpperCase();
            return t.includes('ETF') || t.includes('EXCHANGE TRADED FUND');
        });
        const other = watchlist.filter(item => {
            const t = (item.type || '').toUpperCase();
            const isEq = t === 'AZIONI' || t === 'EQUITY' || t === 'STOCK' || t === 'COMMON STOCK';
            const isEtf = t.includes('ETF') || t.includes('EXCHANGE TRADED FUND');
            return !isEq && !isEtf;
        });

        const renderSection = (items, title) => {
            if (!items || items.length === 0) return '';
            return `
                <div class="px-2 py-3 text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400">
                    ${title} (${items.length})
                </div>
                ${items.map(item => {
                    const perf = performanceData[item.ticker] || {};
                    const d1 = item.changePercent || 0;
                    
                    let typeLabel = item.type || 'Other';
                    const t = typeLabel.toUpperCase();
                    if (t === 'AZIONI' || t === 'EQUITY' || t === 'STOCK' || t === 'COMMON STOCK') typeLabel = 'Equity';
                    else if (t.includes('ETF') || t.includes('EXCHANGE TRADED FUND')) typeLabel = 'ETF';
                    else if (t.includes('MUTUAL FUND')) typeLabel = 'Fund';

                    const typeColor = typeLabel === 'Equity' ? 'bg-primary/10 text-primary border-primary/20' : 
                                    typeLabel === 'ETF' ? 'bg-amber-500/10 text-amber-500 border-amber-500/20' : 
                                    'bg-slate-500/10 text-slate-500 border-slate-500/20';

                    return `
                        <div class="mob-watchlist-item" onclick="window.showMobDetails('${item.ticker.replace(/'/g, "\\'")}', '${typeLabel}')">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-base font-black">${item.ticker}</span>
                                        <span class="text-[9px] font-black uppercase tracking-widest px-1.5 py-0.5 rounded border ${typeColor}">
                                            ${typeLabel}
                                        </span>
                                    </div>
                                    <div class="text-[11px] font-bold text-slate-500 truncate mt-0.5 max-w-[150px]">${item.name}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-base font-black text-primary">${formatCurrency(item.currentPrice, item.currency, 2)}</div>
                                    <div class="mt-1 flex justify-end">${renderPerf(d1)}</div>
                                </div>
                            </div>
                            <div class="flex gap-4 overflow-x-auto pb-1 no-scrollbar border-t border-slate-100 dark:border-slate-800/50 pt-4">
                                <div class="flex flex-col gap-1.5 min-w-[70px]">
                                    <span class="text-[9px] uppercase font-black text-slate-400 tracking-widest">1 Week</span>
                                    ${renderPerf(perf.perf1W)}
                                </div>
                                <div class="flex flex-col gap-1.5 min-w-[70px]">
                                    <span class="text-[9px] uppercase font-black text-slate-400 tracking-widest">1 Month</span>
                                    ${renderPerf(perf.perf1M)}
                                </div>
                                <div class="flex flex-col gap-1.5 min-w-[70px]">
                                    <span class="text-[9px] uppercase font-black text-slate-400 tracking-widest">1 Year</span>
                                    ${renderPerf(perf.perf1Y)}
                                </div>
                            </div>
                            <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800/50 flex justify-end">
                                <button onclick="event.stopPropagation(); window.removeFromWatchlist('${item.ticker.replace(/'/g, "\\'")}')" class="text-rose-500 text-[10px] font-black uppercase tracking-widest flex items-center gap-2 px-3 py-1.5 bg-rose-500/5 rounded-lg border border-rose-500/10">
                                    <span class="material-symbols-outlined text-xs">delete</span> Remove
                                </button>
                            </div>
                        </div>
                    `;
                }).join('')}
            `;
        };

        const listHtml = (renderSection(equities, 'Equity') + renderSection(etfs, 'ETF') + renderSection(other, 'Other')).trim();
        if (listHtml === '' && watchlist.length > 0) {
            container.innerHTML = renderSection(watchlist, 'Watchlist Items');
        } else {
            container.innerHTML = listHtml;
        }
    }

    function renderPerf(val) {
        const performanceData = window.performanceData || {};
        const watchlist = window.watchlist || [];
        if (val === undefined || val === null) {
            if (Object.keys(performanceData).length === 0 && watchlist.length > 0) {
                return `<span class="animate-pulse text-slate-300 dark:text-slate-700 font-black text-[10px]">...</span>`;
            }
            return `<span class="text-slate-300 dark:text-slate-700 font-bold text-[11px] tracking-tighter">—</span>`;
        }
        const isPos = val >= 0;
        const color = isPos ? 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20' : 'bg-rose-500/10 text-rose-500 border-rose-500/20';
        return `<span class="mob-perf-badge border ${color}">${isPos ? '+' : ''}${val.toFixed(1)}%</span>`;
    }

    async function removeFromWatchlist(ticker) {
        if (!confirm(`Remove ${ticker}?`)) return;
        try {
            await fetch(`/api/watchlist/${ticker}`, { method: 'DELETE' });
            window.watchlist = (window.watchlist || []).filter(it => it.ticker !== ticker);
            renderWatchlist();
        } catch (err) {
            alert('Error: ' + err.message);
        }
    }
    window.removeFromWatchlist = removeFromWatchlist;

    async function showMobDetails(ticker, typeLabel) {
        console.log('Opening mobile details for:', ticker);
        try {
            const res = await fetch(`/api/assets/${ticker}/details`);
            const data = await res.json();
            
            const sd = data.summaryDetail || {};
            const fd = data.financialData || {};
            const ks = data.defaultKeyStatistics || {};
            const ap = data.assetProfile || {};
            const fp = data.fundProfile || {};
            
            document.getElementById('mob-modal-ticker').innerText = ticker;
            document.getElementById('mob-modal-name').innerText = ap.longName || data.quoteType?.longName || ticker;
            document.getElementById('mob-modal-exchange').innerText = sd.exchange || 'Unknown';
            
            const content = document.getElementById('mob-modal-content');
            let fields = [];

            if (typeLabel === 'ETF') {
                const fees = fp.feesExpensesInvestment || {};
                fields = [
                    { label: 'Asset Totali (AUM)', val: formatLarge(fees.totalNetAssets) },
                    { label: 'TER', val: formatPct(fees.annualReportExpenseRatio) },
                    { label: 'Beta (3Y)', val: formatNum(sd.beta) },
                    { label: 'Yield', val: formatPct(sd.dividendYield) },
                    { label: 'Inception', val: ks.fundInceptionDate ? new Date(ks.fundInceptionDate).toLocaleDateString() : 'N/A' },
                    { label: 'Legal Type', val: fp.legalType || 'N/A' }
                ];
            } else {
                const nextDiv = data.calendarEvents?.dividendDate || data.calendarEvents?.exDividendDate;
                fields = [
                    { label: 'P/E Ratio', val: formatNum(sd.trailingPE) },
                    { label: 'Forward P/E', val: formatNum(sd.forwardPE) },
                    { label: 'Dividend Yield', val: formatPct(sd.dividendYield) },
                    { label: 'EPS (Trailing)', val: formatNum(ks.trailingEps) },
                    { label: 'Beta', val: formatNum(sd.beta) },
                    { label: 'Prossimo Stacco', val: nextDiv ? new Date(nextDiv).toLocaleDateString('it-IT') : 'N/A' }
                ];
            }

            content.innerHTML = fields.map(f => `
                <div class="flex flex-col gap-0.5">
                    <span class="mob-detail-label">${f.label}</span>
                    <span class="mob-detail-value">${f.val || 'N/A'}</span>
                </div>
            `).join('');

            document.getElementById('mob-modal-perf-badge').innerHTML = ''; // Reset
            document.getElementById('mob-detail-overlay').style.display = 'block';
            const sheet = document.getElementById('mob-detail-sheet');
    window.showMobDetails = showMobDetails;

    async function closeMobDetail() {
        const sheet = document.getElementById('mob-detail-sheet');
        const overlay = document.getElementById('mob-detail-overlay');
        if (sheet) sheet.style.transform = 'translateY(100%)';
        setTimeout(() => {
            if (overlay) overlay.style.display = 'none';
            if (sheet) sheet.style.display = 'none';
        }, 300);
        if (window._mobDetailChart) {
            window._mobDetailChart.destroy();
            window._mobDetailChart = null;
        }
    }
    window.closeMobDetail = closeMobDetail;

    function formatNum(n) { return n ? n.toFixed(2) : null; }
    function formatPct(n) { return n ? (n * 100).toFixed(1) + '%' : null; }
    function formatLarge(n) {
        if (!n) return null;
        if (n >= 1e12) return (n / 1e12).toFixed(1) + 'T';
        if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
        if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
        return n.toLocaleString();
    }

    // Search logic (simplified for mobile)
    const searchInput = document.getElementById('mob-asset-search');
    const suggestionsBox = document.getElementById('mob-search-suggestions');
    let searchTimeout;

    searchInput.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        const q = searchInput.value.trim();
        if (q.length < 2) { suggestionsBox.classList.add('hidden'); return; }
        searchTimeout = setTimeout(async () => {
            const res = await fetch(`/api/market/search?q=${encodeURIComponent(q)}`);
            const suggestions = await res.json();
            renderSuggestions(suggestions);
        }, 300);
    });

    function renderSuggestions(list) {
        const box = document.getElementById('mob-search-suggestions');
        if (!box) return;
        if (!list.length) { box.classList.add('hidden'); return; }
        box.innerHTML = list.map(s => `
            <div class="px-4 py-4 hover:bg-slate-100 dark:hover:bg-slate-800 border-b border-slate-50 dark:border-slate-800 last:border-0" 
                 onclick="window.addToWatchlist('${s.ticker.replace(/'/g, "\\'")}')">
                <div class="flex justify-between">
                    <span class="font-black text-primary">${s.ticker}</span>
                    <span class="text-[9px] font-black uppercase bg-slate-100 dark:bg-slate-700 px-1 py-0.5 rounded text-slate-500">${s.type}</span>
                </div>
                <div class="text-[11px] font-bold text-slate-500 truncate mt-1">${s.name}</div>
            </div>
        `).join('');
        box.classList.remove('hidden');
    }

    async function addToWatchlist(ticker) {
        const box = document.getElementById('mob-search-suggestions');
        const input = document.getElementById('mob-asset-search');
        if (box) box.classList.add('hidden');
        if (input) input.value = '';
        try {
            await fetch('/api/watchlist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticker })
            });
            loadWatchlist();
        } catch (err) { alert('Failed: ' + err.message); }
    }
    window.addToWatchlist = addToWatchlist;

    document.addEventListener('DOMContentLoaded', () => {
        console.log('Mobile: DOMContentLoaded, loading watchlist...');
        // Ensure detail sheet starts definitely hidden
        if (window.closeMobDetail) closeMobDetail();
        loadWatchlist();
    });
</script>

<!-- Scripts at the bottom to ensure DOM is ready -->
<script src="/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>
</html>
