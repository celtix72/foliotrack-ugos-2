<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>M2T - Watchlist</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="M2T">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/dist/output.css">
    <link rel="stylesheet" href="/mobile.css">
    <script src="/theme.js"></script>
    <script src="/transaction_modal.js"></script>
    <script src="/mobile_transactions.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <script src="/asset_chart_component.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .dark .tab-active { background: #1e293b; color: #135bec; }
        
        /* Hide global add transaction FAB */
        #global-mob-fab { display: none !important; }

        /* Force visibility of #mobile-ui when mobile view is active */
        body.mobile-view-active #mobile-ui { display: flex !important; visibility: visible !important; opacity: 1 !important; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen mobile-view-active">

<div id="mobile-ui" class="flex flex-col fixed inset-0 w-full overflow-hidden" style="display: flex !important; height: 100dvh !important;">
    <!-- Header -->
    <div class="mob-header">
        <div class="mob-header-logo-container">
            <div class="mob-header-logo-circle">
                <span class="material-symbols-outlined">insights</span>
            </div>
            <div class="mob-header-logo-text">M2T</div>
        </div>

        <div style="flex:1"></div>

        <!-- EU / US Market Status Pill -->
        <div class="mob-header-market-pill">
            <div class="mob-market-item">
                <span>EU</span>
                <span id="mob-dot-eu" class="mob-market-dot"></span>
            </div>
            <div class="mob-market-item">
                <span>US</span>
                <span id="mob-dot-us" class="mob-market-dot"></span>
            </div>
        </div>

        <!-- Day Variation Pill -->
        <div id="mob-header-var-day" class="mob-header-var-pill">--</div>

        <!-- Action Buttons -->
        <div class="mob-header-actions">
            <a href="/notifications" class="mob-icon-btn relative" title="Notifications">
                <span class="material-symbols-outlined">notifications</span>
                <span id="mob-notification-badge" class="mob-badge" style="display: none;">0</span>
            </a>
            <a href="/settings" class="mob-icon-btn" title="Settings">
                <span class="material-symbols-outlined">settings</span>
            </a>
        </div>
    </div>

    <!-- Search Bar matching Market style but always visible here -->
    <div class="p-4 border-b border-slate-100 dark:border-slate-800/50 bg-white dark:bg-slate-900 relative z-[10000]" style="overflow: visible !important;">
        <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400 text-sm">search</span>
            <input type="text" id="mob-asset-search" placeholder="Cerca ticker (es. AAPL)..." 
                   class="w-full bg-slate-100 dark:bg-slate-800 border-none rounded-xl pl-10 pr-4 py-2.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-primary/20">
        </div>
    </div>

    <!-- Content -->
    <div class="mob-scroll relative z-[1]" id="mob-watchlist-scroll">
        <div class="mob-section-header">
            <span class="mob-section-title">La Tua Watchlist</span>
            <span id="mob-watchlist-count" class="mob-header-subtitle">0 Assets</span>
        </div>

        <div id="mob-watchlist-container" class="mob-list-edge">
            <!-- Items injected here -->
        </div>

        <div id="mob-watchlist-empty" class="py-20 text-center hidden">
            <span class="material-symbols-outlined text-6xl text-slate-200 dark:text-slate-800 mb-4 font-variation-settings-fill">visibility_off</span>
            <p class="text-slate-500 font-bold">Watchlist vuota</p>
            <p class="text-slate-400 text-[10px] mt-1 font-bold uppercase tracking-wider">Aggiungi un asset per iniziare</p>
        </div>
        
        <div style="height: 100px"></div>
    </div>

    <!-- Redundant Modal Removed: Using shared asset_chart_component.js -->

    <!-- Bottom Tab Bar -->
    <div class="mob-tab-bar">
        <a href="/dashboard" class="mob-tab-item">
            <span class="material-symbols-outlined">dashboard</span>
        </a>
        <a href="/market" class="mob-tab-item">
            <span class="material-symbols-outlined">trending_up</span>
        </a>
        <a href="/watchlist" class="mob-tab-item active">
            <span class="material-symbols-outlined">visibility</span>
        </a>
        <a href="/history" class="mob-tab-item">
            <span class="material-symbols-outlined">history</span>
        </a>
        <a href="/dividend" class="mob-tab-item">
            <span class="material-symbols-outlined">payments</span>
        </a>
        <a href="/reports" class="mob-tab-item">
            <span class="material-symbols-outlined">pie_chart</span>
        </a>
    </div>
</div>


<script>
    // Global storage
    window.watchlist = [];
    window.performanceData = {};
    window._mobDetailChart = null;

    // ── Swipe Logic
    let touchStartX = 0;
    let touchMoveX = 0;
    let currentSwipeEl = null;
    const SWIPE_THRESHOLD = 50;
    const ACTION_WIDTH = 65; // 1 button * 65px

    window.handleTouchStart = function(e, container) {
        touchStartX = e.touches[0].clientX;
        touchMoveX = 0;
        if (currentSwipeEl && currentSwipeEl !== container) {
            resetSwipes(container);
        }
    };

    window.handleTouchMove = function(e, container) {
        const item = container.querySelector('.mob-holding-item');
        if (!item) return;
        touchMoveX = e.touches[0].clientX;
        let diff = touchMoveX - touchStartX;
        if (diff > 0) diff = 0;
        if (diff < -ACTION_WIDTH - 20) diff = -ACTION_WIDTH - 20;
        item.style.transition = 'none';
        item.style.transform = `translateX(${diff}px)`;
    };

    window.handleTouchEnd = function(e, container) {
        const item = container.querySelector('.mob-holding-item');
        if (!item) return;
        const diff = touchMoveX - touchStartX;
        
        item.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
        
        // If movement occurred and was beyond threshold, keep actions open.
        // Otherwise (including simple tap), reset to 0. (Tap-to-close)
        if (touchMoveX !== 0 && diff < -SWIPE_THRESHOLD) {
            item.style.transform = `translateX(-${ACTION_WIDTH}px)`;
            currentSwipeEl = container;
        } else {
            item.style.transform = 'translateX(0)';
            currentSwipeEl = null;
        }
    };

    function resetSwipes(except) {
        document.querySelectorAll('.mob-holding-swipe-container').forEach(c => {
            if (c === except) return;
            const item = c.querySelector('.mob-holding-item');
            if (item) item.style.transform = 'translateX(0)';
        });
        currentSwipeEl = null;
    }

    // Helper functions
    function formatLarge(n) {
        if (!n) return null;
        if (n >= 1e12) return (n / 1e12).toFixed(1) + 'T';
        if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
        if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
        return n.toLocaleString();
    }
    function formatNum(n) { return n ? n.toFixed(2) : null; }
    function formatPct(n) { return n ? (n * 100).toFixed(1) + '%' : null; }

    const getAssetTag = (type, ticker) => {
        const t = (type || '').toUpperCase();
        const tk = (ticker || '').toUpperCase();
        if (tk.startsWith('CD_')) return 'CD';
        if (t.includes('ETF')) return 'ETF';
        if (t.includes('BOND') || t.includes('FIXED INCOME') || tk.startsWith('BTP')) return 'Bond';
        return 'Az';
    };

    async function loadWatchlist() {
        try {
            const resW = await fetch('/api/watchlist');
            window.watchlist = await resW.json();
            window._watchlistItems = window.watchlist;
            renderWatchlist();

            // Load performance in background
            const resP = await fetch('/api/watchlist/performance');
            window.performanceData = await resP.json();
            renderWatchlist();
        } catch (err) {
            console.error('Failed to load watchlist:', err);
        }
    }
    window.loadWatchlist = loadWatchlist;

    function renderWatchlist() {
        const container = document.getElementById('mob-watchlist-container');
        const empty = document.getElementById('mob-watchlist-empty');
        const countEl = document.getElementById('mob-watchlist-count');
        let watchlist = window.watchlist || [];
        
        // Dynamic sorting: Highest changePercent first
        watchlist.sort((a, b) => (b.changePercent || 0) - (a.changePercent || 0));

        if (countEl) countEl.textContent = `${watchlist.length} Assets`;

        if (!watchlist || watchlist.length === 0) {
            if (container) container.innerHTML = '';
            if (empty) empty.classList.remove('hidden');
            return;
        }
        if (empty) empty.classList.add('hidden');

        container.innerHTML = watchlist.map(a => {
            const price = a.currentPrice || 0;
            const change = a.changePercent || 0;
            const isPos = change >= 0;
            const color = isPos ? 'var(--mob-emerald)' : 'var(--mob-rose)';
            const tag = getAssetTag(a.yfType || a.type, a.ticker);

            const targetPrice = a.targetPrice || 0;
            const targetPrice2 = a.targetPrice2 || 0;
            const stopLoss = a.stopLoss || 0;
            const volThreshold = a.volatilityAlert || 0;

            const targetReached = targetPrice > 0 && price >= targetPrice;
            const target2Reached = targetPrice2 > 0 && price >= targetPrice2;
            const stopLossHit = stopLoss > 0 && price <= stopLoss;
            const volAlertTriggered = volThreshold > 0 && Math.abs(change) >= volThreshold;

            let alertBg = '';
            let alertBorder = '';
            
            if (targetReached || target2Reached) {
                alertBg = 'background: linear-gradient(rgba(16,185,129,0.12), rgba(16,185,129,0.12)), var(--mob-surface)';
                alertBorder = 'border-color: rgba(16,185,129,0.3) !important';
            } else if (stopLossHit) {
                alertBg = 'background: linear-gradient(rgba(244,63,94,0.12), rgba(244,63,94,0.12)), var(--mob-surface)';
                alertBorder = 'border-color: rgba(244,63,94,0.3) !important';
            } else if (volAlertTriggered) {
                alertBg = 'background: linear-gradient(rgba(245,158,11,0.12), rgba(245,158,11,0.12)), var(--mob-surface)';
                alertBorder = 'border-color: rgba(245,158,11,0.3) !important';
            }

            let alertTags = '';
            if (targetPrice > 0) {
                alertTags += `
                    <div class="flex items-center gap-1 px-1.5 py-0.5 rounded-md ${targetReached ? 'bg-emerald-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'} text-[8px] font-black uppercase">
                        <span class="material-symbols-outlined text-[10px]">${targetReached ? 'check_circle' : 'notifications_active'}</span>
                        TP1: ${formatCurrency(targetPrice, a.currency, 2)}
                    </div>`;
            }
            if (targetPrice2 > 0) {
                alertTags += `
                    <div class="flex items-center gap-1 px-1.5 py-0.5 rounded-md ${target2Reached ? 'bg-emerald-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'} text-[8px] font-black uppercase">
                        <span class="material-symbols-outlined text-[10px]">${target2Reached ? 'check_circle' : 'notifications_active'}</span>
                        TP2: ${formatCurrency(targetPrice2, a.currency, 2)}
                    </div>`;
            }
            if (volThreshold > 0) {
                alertTags += `
                    <div class="flex items-center gap-1 px-1.5 py-0.5 rounded-md ${volAlertTriggered ? 'bg-amber-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'} text-[8px] font-black uppercase">
                        <span class="material-symbols-outlined text-[10px]">${volAlertTriggered ? 'priority_high' : 'bolt'}</span>
                        VOL: ${volThreshold}%
                    </div>`;
            }
            if (stopLoss > 0) {
                alertTags += `
                    <div class="flex items-center gap-1 px-1.5 py-0.5 rounded-md ${stopLossHit ? 'bg-rose-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'} text-[8px] font-black uppercase">
                        <span class="material-symbols-outlined text-[10px]">${stopLossHit ? 'dangerous' : 'gpp_maybe'}</span>
                        SL: ${formatCurrency(stopLoss, a.currency, 2)}
                    </div>`;
            }

            return `
                <div class="mob-holding-swipe-container" 
                     ontouchstart="handleTouchStart(event, this)" 
                     ontouchmove="handleTouchMove(event, this)" 
                     ontouchend="handleTouchEnd(event, this)">
                    
                    <div class="mob-holding-actions">
                        <div class="mob-action-btn bg-red-ios" 
                             onclick="event.stopPropagation(); window.removeFromWatchlist('${a.ticker.replace(/'/g, "\\'")}', ${!!a.hasPosition})">
                            <span class="material-symbols-outlined">delete</span>
                            <span>Rimuovi</span>
                        </div>
                    </div>

                    <div class="mob-holding-item" style="${alertBg}; ${alertBorder}" onclick="window.showMobDetails('${a.ticker.replace(/'/g, "\\'")}', '${a.name ? a.name.replace(/'/g, "\\'") : ''}', '${a.currency || 'EUR'}')">
                        <div class="mob-holding-logo">${a.ticker.substring(0,3)}</div>
                        <div class="mob-holding-info">
                            <div class="flex items-center gap-2">
                                <div class="mob-holding-ticker">${a.ticker}</div>
                                <div class="px-1.5 py-0.5 rounded-md border text-[8px] font-black uppercase tracking-tighter bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700">${tag}</div>
                            </div>
                            <div class="mob-holding-name">${a.name || ''}</div>
                            <div class="flex flex-wrap gap-1.5 mt-1">
                                ${alertTags}
                            </div>
                        </div>
                        <div class="mob-holding-values">
                            <div class="mob-holding-value">${formatCurrency(price, a.currency, 2)}</div>
                            <div class="flex items-center justify-end gap-1.5 mt-0.5">
                                ${(a.preMarketChangePercent && Math.abs(a.preMarketChangePercent) > 0.01 && !window._mobMarketOpen) ? `
                                    <span style="font-size:10px; font-weight:900; color:${a.preMarketChangePercent >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)'}">
                                        (${a.preMarketChangePercent >= 0 ? '+' : ''}${a.preMarketChangePercent.toFixed(1)}%)
                                    </span>
                                ` : ''}
                                ${(a.postMarketChangePercent && Math.abs(a.postMarketChangePercent) > 0.01 && !window._mobMarketOpen) ? `
                                    <span style="font-size:10px; font-weight:900; color:${a.postMarketChangePercent >= 0 ? 'var(--mob-emerald)' : 'var(--mob-rose)'}">
                                        (${a.postMarketChangePercent >= 0 ? '+' : ''}${a.postMarketChangePercent.toFixed(1)}%)
                                    </span>
                                ` : ''}
                                <div class="mob-holding-gain" style="color:${color}; font-weight:900; margin-top:0">${isPos ? '+' : ''}${change.toFixed(1)}%</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }
    window.renderWatchlist = renderWatchlist;

    async function removeFromWatchlist(ticker) {
        if (!confirm(`Remove ${ticker}?`)) return;
        try {
            await fetch(`/api/watchlist/${ticker}`, { method: 'DELETE' });
            window.watchlist = (window.watchlist || []).filter(it => it.ticker !== ticker);
            renderWatchlist();
        } catch (err) {
            alert('Error: ' + err.message);
        }
    }
    window.removeFromWatchlist = removeFromWatchlist;

    async function showMobDetails(ticker, name, currency) {
        if (typeof openAssetChartModal === 'function') {
            openAssetChartModal(ticker, name, currency);
        }
    }
    window.showMobDetails = showMobDetails;

    async function addToWatchlist(ticker) {
        const box = document.getElementById('mob-search-suggestions');
        const input = document.getElementById('mob-asset-search');
        if (box) box.classList.add('hidden');
        if (input) input.value = '';
        try {
            await fetch('/api/watchlist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticker })
            });
            loadWatchlist();
        } catch (err) { alert('Failed: ' + err.message); }
    }
    window.addToWatchlist = addToWatchlist;

    function renderSuggestions(list) {
        const box = document.getElementById('mob-search-suggestions');
        if (!box) return;
        if (!list || !list.length) { box.classList.add('hidden'); return; }
        box.innerHTML = list.map(s => {
            const ticker = s.symbol || s.ticker || '';
            if (!ticker) return ''; 
            const name = s.shortname || s.longname || s.name || ticker;
            const type = s.quoteType || s.type || 'Equity';
            return `
                <div class="px-4 py-4 hover:bg-slate-100 dark:hover:bg-slate-800 border-b border-slate-50 dark:border-slate-800 last:border-0" 
                     onclick="window.addToWatchlist('${ticker.replace(/'/g, "\\'")}')">
                    <div class="flex justify-between">
                        <span class="font-black text-primary">${ticker}</span>
                        <span class="text-[9px] font-black uppercase bg-slate-100 dark:bg-slate-700 px-1 py-0.5 rounded text-slate-500">${type}</span>
                    </div>
                    <div class="text-[11px] font-bold text-slate-500 truncate mt-1">${name}</div>
                </div>
            `;
        }).filter(h => h !== '').join('');
        box.classList.remove('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Search Initialization
        const searchInput = document.getElementById('mob-asset-search');
        const suggestionsBox = document.getElementById('mob-search-suggestions');
        
        if (searchInput) {
            let searchTimeout;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                const q = searchInput.value.trim();
                if (q.length < 2) { 
                    if (suggestionsBox) suggestionsBox.classList.add('hidden'); 
                    return; 
                }
                searchTimeout = setTimeout(async () => {
                    try {
                        const res = await fetch(`/api/asset-search?query=${encodeURIComponent(q)}`);
                        const suggestions = await res.json();
                        renderSuggestions(suggestions);
                    } catch (err) { console.error('Search error:', err); }
                }, 300);
            });
        }

        // Global click to close suggestions
        document.addEventListener('click', (e) => {
            if (searchInput && !searchInput.contains(e.target) && suggestionsBox && !suggestionsBox.contains(e.target)) {
                suggestionsBox.classList.add('hidden');
            }
        });

        window.addEventListener('market-data-updated', () => {
            loadWatchlist();
        });

        async function mobSyncMarketStatus() {
            try {
                const res = await fetch('/api/market-status');
                const s = await res.json();
                window._mobMarketOpen = s.anyOpen;
                
                const dotEu = document.getElementById('mob-dot-eu');
                const dotUs = document.getElementById('mob-dot-us');
                if (dotEu) dotEu.className = 'mob-market-dot' + (s.euOpen ? ' live' : '');
                if (dotUs) dotUs.className = 'mob-market-dot' + (s.usOpen ? ' live' : '');
                
                // Refresh list to update pre/post market visibility
                if (window.watchlist && window.watchlist.length > 0) renderWatchlist();
            } catch(e) {}
        }

        mobSyncMarketStatus();
        setInterval(mobSyncMarketStatus, 30000);

        loadWatchlist();
    });
</script>

    <!-- Portal for search suggestions (iOS fix: root level fixed avoids flex stacking issues) -->
    <div id="mob-search-suggestions" class="fixed top-[124px] left-0 right-0 bottom-[var(--mob-tab-h)] bg-white dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 z-[12000] hidden overflow-y-auto shadow-2xl"></div>

</body>
</html>
