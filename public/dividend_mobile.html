<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>FolioTrack - Dividends</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FolioTrack">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/dist/output.css">
    <link rel="stylesheet" href="/mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/theme.js"></script>
</head>
<body class="bg-background-light dark:bg-[#0b0f1a] text-slate-900 dark:text-slate-100 min-h-screen flex mobile-view-active">
    <div id="mobile-ui">
        <!-- ── Mobile Header ── -->
        <div class="mob-header">
            <div class="mob-header-logo-container">
                <div class="mob-header-logo-circle">
                    <span class="material-symbols-outlined">payments</span>
                </div>
                <div class="mob-header-logo-text">Dividendi</div>
            </div>
            <div style="flex:1"></div>
            <div class="mob-header-actions">
                <a href="/notifications" class="mob-icon-btn relative">
                    <span class="material-symbols-outlined">notifications</span>
                    <span id="mob-notification-badge" class="mob-badge" style="display: none;">0</span>
                </a>
                <a href="/settings" class="mob-icon-btn">
                    <span class="material-symbols-outlined">settings</span>
                </a>
            </div>
        </div>

        <div class="mob-scroll" id="mob-dividend-scroll">
            
            <!-- Hero Stats: KPIs -->
            <div class="mob-hero">
                <div class="mob-hero-label">Ricevuto nel <span id="mob-current-year">2025</span></div>
                <div class="mob-hero-value" id="mob-total-actual">€ 0.00</div>
                
                <div class="grid grid-cols-2 gap-4 mt-6">
                    <div class="mob-hero-stat-item !p-2 !bg-white/5 border-0">
                        <span class="mob-hero-stat-label">Proiezione Totale</span>
                        <div id="mob-total-projected" class="text-blue-400 font-bold">€ 0.00</div>
                    </div>
                    <div class="mob-hero-stat-item !p-2 !bg-white/5 border-0">
                        <span class="mob-hero-stat-label">Residuo Atteso</span>
                        <div id="mob-total-remaining" class="text-amber-400 font-bold">€ 0.00</div>
                    </div>
                </div>
            </div>

            <!-- Distribution Chart Card -->
            <div class="mob-chart-card">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <div class="mob-chart-title" style="margin-bottom:0">Distribuzione</div>
                        <div class="mob-chart-subtitle" style="margin-bottom:0">Proiezioni mensili</div>
                    </div>
                </div>
                <div class="relative h-64">
                    <canvas id="mob-projection-chart"></canvas>
                </div>
            </div>

            <!-- Projected Assets (Collapsible) -->
            <div class="px-5 mb-6">
                <div class="bg-white dark:bg-slate-900/50 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                    <div class="flex items-center justify-between p-4 border-b border-slate-100 dark:border-slate-800/40">
                        <button onclick="document.getElementById('mob-proj-list-content').classList.toggle('hidden')" class="flex items-center gap-2 hover:opacity-70 transition-opacity">
                             <span class="text-[11px] font-black uppercase tracking-widest text-slate-500">Dettaglio Proiezioni</span>
                             <span id="mob-proj-asset-count" class="text-[10px] font-bold text-primary bg-primary/10 px-1.5 rounded-sm">0</span>
                             <span class="material-symbols-outlined text-sm text-slate-400">expand_more</span>
                        </button>
                        <button onclick="openManualModal()" class="text-[10px] font-black uppercase tracking-widest text-primary bg-primary/10 px-2 py-1 rounded-md">
                            + Manuale
                        </button>
                    </div>
                    <div id="mob-proj-list-content" class="hidden">
                        <div id="mob-proj-body" class="divide-y divide-slate-100 dark:divide-slate-800/30">
                            <!-- JS Injected -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Manual Dividend Modal -->
            <div id="manual-modal" class="fixed inset-0 bg-slate-900/50 dark:bg-black/60 backdrop-blur-sm hidden z-[100] flex items-center justify-center p-4">
                <div class="bg-white dark:bg-[#111722] w-full max-w-sm rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-5">
                    <div class="flex justify-between items-center mb-5">
                        <h3 class="text-sm font-black tracking-tight">Dividendo Manuale</h3>
                        <button onclick="closeManualModal()" class="text-slate-400 hover:text-slate-200">
                            <span class="material-symbols-outlined text-lg">close</span>
                        </button>
                    </div>
                    <form id="manual-div-form" onsubmit="submitManualDividend(event)" class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Ticker</label>
                            <input type="text" id="manual-ticker" required placeholder="Es. AAPL" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Data</label>
                            <input type="date" id="manual-date" required class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Importo unitario (€)</label>
                            <input type="number" step="0.0001" id="manual-amount" required placeholder="0.00" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 text-sm font-mono">
                        </div>
                        <button type="submit" class="w-full mt-4 py-2 bg-primary hover:bg-primary/90 text-white font-bold rounded-lg text-sm">
                            Salva
                        </button>
                    </form>
                </div>
            </div>


            <!-- Filters & History Section -->
            <div class="mob-section-header">
                <span class="mob-section-title">Storico Pagamenti</span>
                <select id="mob-div-group-by" onchange="renderMobDividends()" 
                    class="bg-transparent border-none text-[11px] font-black uppercase tracking-wider text-primary focus:ring-0 p-0 text-right outline-none">
                    <option value="year">Per Anno</option>
                    <option value="portfolioName">Per Portafoglio</option>
                    <option value="none">Lista</option>
                </select>
            </div>

            <div class="px-5 mb-4">
                <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-900/80 p-2.5 px-3 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                    <span class="material-symbols-outlined text-slate-400 text-[18px]">search</span>
                    <input type="text" id="mob-div-search" placeholder="Cerca titolo o portafoglio..." 
                        class="flex-1 bg-transparent border-none p-0 text-[13px] focus:ring-0 font-bold placeholder:text-slate-400"
                        oninput="renderMobDividends()">
                </div>
            </div>

            <div id="mob-dividends-list" class="mob-holdings-list">
                <div style="text-align:center;padding:48px">
                    <div class="mob-spinner" style="margin:0 auto"></div>
                </div>
            </div>

            <div style="height:60px"></div>
        </div>

        <!-- ── Bottom Tab Bar ── -->
        <div class="mob-tab-bar">
            <a href="/dashboard" class="mob-tab-item">
                <span class="material-symbols-outlined">dashboard</span>
            </a>
            <a href="/market" class="mob-tab-item">
                <span class="material-symbols-outlined">trending_up</span>
            </a>
            <a href="/history" class="mob-tab-item">
                <span class="material-symbols-outlined">history</span>
            </a>
            <a href="/dividend" class="mob-tab-item active">
                <span class="material-symbols-outlined">payments</span>
            </a>
            <a href="/reports" class="mob-tab-item">
                <span class="material-symbols-outlined">pie_chart</span>
            </a>
        </div>
    </div>

    <script>
        (function() {
            let rawDivData = [];
            let collapsedGroups = new Set();
            let currentGroupBy = 'year';
            let mobProjChart = null;

            async function loadMobData() {
                try {
                    // Load Projections
                    const projRes = await fetch('/api/analytics/dividend-projections');
                    const projData = await projRes.json();
                    
                    document.getElementById('mob-current-year').innerText = projData.year;
                    document.getElementById('mob-total-actual').innerText = formatCurrency(projData.totalActual, 'EUR');
                    document.getElementById('mob-total-projected').innerText = formatCurrency(projData.totalProjected, 'EUR');
                    document.getElementById('mob-total-remaining').innerText = formatCurrency(Math.max(0, projData.totalProjected - projData.totalActual), 'EUR');

                    renderMobProjectionChart(projData.months);
                    renderMobProjList(projData.assets);

                    // Load History
                    const histRes = await fetch('/api/analytics/dividends');
                    rawDivData = await histRes.json();
                    
                    const currentYear = new Date().getFullYear().toString();
                    const years = [...new Set(rawDivData.map(d => d.date.split('-')[0]))];
                    collapsedGroups = new Set(years.filter(y => y !== currentYear));

                    renderMobDividends();
                } catch (err) { console.error('Error loading mobile dividends data:', err); }
            }

            window.openManualModal = () => document.getElementById('manual-modal').classList.remove('hidden');
            window.closeManualModal = () => {
                document.getElementById('manual-modal').classList.add('hidden');
                document.getElementById('manual-div-form').reset();
            };
            window.submitManualDividend = async (e) => {
                e.preventDefault();
                const ticker = document.getElementById('manual-ticker').value;
                const exDate = document.getElementById('manual-date').value;
                const amount = document.getElementById('manual-amount').value;
                try {
                    const res = await fetch('/api/dividends/manual-projections', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ ticker, exDate, amount })
                    });
                    if (res.ok) {
                        window.closeManualModal();
                        loadMobData();
                    } else alert('Errore al salvataggio');
                } catch (err) { console.error(err); }
            };

            function renderMobProjectionChart(months) {
                const ctx = document.getElementById('mob-projection-chart').getContext('2d');
                if (mobProjChart) mobProjChart.destroy();

                const isDark = document.documentElement.classList.contains('dark');
                const textColor = isDark ? '#94a3b8' : '#64748b';
                const gridColor = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';
                const tickersData = months.map(m => m.tickers.join(', '));

                mobProjChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: months.map(m => m.name),
                        datasets: [
                            {
                                label: 'Ricevuto',
                                data: months.map(m => m.actual),
                                backgroundColor: 'rgba(16,185,129,0.75)', // Green
                                borderRadius: 4,
                                borderSkipped: false
                            },
                            {
                                label: 'Proiettato',
                                data: months.map(m => m.display),
                                backgroundColor: 'rgba(6,182,212,0.6)', // Cyan
                                borderColor: 'rgba(6,182,212,1)',
                                borderWidth: 1,
                                borderRadius: 4,
                                borderSkipped: false
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: { padding: { top: 25, bottom: 20 } },
                        plugins: {
                            legend: { display: false },
                            tooltip: { 
                                intersect: false, 
                                mode: 'index',
                                backgroundColor: isDark ? '#1e293b' : '#fff',
                                titleColor: isDark ? '#f1f5f9' : '#1e293b',
                                bodyColor: isDark ? '#f1f5f9' : '#1e293b',
                                borderColor: isDark ? '#334155' : '#e2e8f0',
                                borderWidth: 1,
                                callbacks: {
                                    afterBody: (context) => {
                                        const idx = context[0].dataIndex;
                                        if (tickersData[idx]) return '\nAsset: ' + tickersData[idx];
                                        return '';
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { 
                                stacked: true, 
                                grid: { display: false }, 
                                ticks: { color: textColor, font: { size: 9, weight: 'bold' } } 
                            },
                            y: { 
                                stacked: true, 
                                grid: { color: gridColor }, 
                                ticks: { color: textColor, font: { size: 9 }, callback: v => '€' + v } 
                            }
                        }
                    },
                    plugins: [{
                        id: 'barLabelsAndTickers',
                        afterDatasetsDraw(chart) {
                            const {ctx} = chart;
                            ctx.save();
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'bottom';
                            ctx.font = 'bold 8px sans-serif';
                            ctx.fillStyle = textColor;

                            const chartData = chart.data;
                            const meta0 = chart.getDatasetMeta(0);
                            const meta1 = chart.getDatasetMeta(1);
                            const xAxis = chart.scales.x;

                            chartData.labels.forEach((label, i) => {
                                const val0 = chartData.datasets[0].data[i] || 0;
                                const val1 = chartData.datasets[1].data[i] || 0;
                                const total = val0 + val1;
                                
                                const xPos = xAxis.getPixelForTick(i);

                                if (total > 0) {
                                    const topY = Math.min(meta0.data[i].y, meta1.data[i].y);
                                    ctx.fillText('€' + Math.round(total), xPos, topY - 5);
                                }

                                const t = tickersData[i];
                                if (t) {
                                    ctx.textBaseline = 'top';
                                    const yPos = chart.chartArea.bottom + 8;
                                    let txt = t.length > 7 ? t.substring(0, 5) + '..' : t;
                                    ctx.fillText(txt, xPos, yPos);
                                }
                            });
                            ctx.restore();
                        }
                    }]
                });
            }

            function renderMobProjList(assets) {
                const countEl = document.getElementById('mob-proj-asset-count');
                const bodyEl = document.getElementById('mob-proj-body');
                
                countEl.innerText = assets.length;
                bodyEl.innerHTML = assets.map(a => {
                    let badge = '';
                    if (a.tag === 'REGISTRATO') badge = '<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-emerald-500/10 text-emerald-500">Ricevuto</span>';
                    if (a.tag === 'YF') badge = '<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-blue-500/10 text-blue-400">YF</span>';
                    if (a.tag === 'STORICO') badge = '<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-slate-500/10 text-slate-500">Storico</span>';
                    if (a.tag === 'MANUALE') badge = '<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-purple-500/10 text-purple-400">Manuale</span>';

                    return `
                    <div class="p-4 flex flex-col gap-1">
                        <div class="flex items-center justify-between">
                            <span class="text-[13px] font-black">${a.ticker} <span class="opacity-50 text-[10px] ml-1">${a.date}</span></span>
                            <span class="text-[13px] font-black text-blue-400">€ ${Math.round(a.totalAmount).toLocaleString('it-IT')}</span>
                        </div>
                        <div class="flex items-center justify-between text-[10px] font-bold opacity-60 mt-1">
                            <span class="truncate pr-4">${(a.name && a.name !== 'null') ? a.name : a.ticker}</span>
                            <div class="flex items-center gap-2">
                                ${badge}
                                <span class="text-slate-500 hidden sm:inline-block">${(a.yield * 100).toFixed(2)}% YLD</span>
                            </div>
                        </div>
                    </div>
                `}).join('');
            }

            window.toggleMobGroup = (key) => {
                if (collapsedGroups.has(key)) collapsedGroups.delete(key);
                else collapsedGroups.add(key);
                renderMobDividends();
            }

            window.renderMobDividends = () => {
                const container = document.getElementById('mob-dividends-list');
                const searchEl = document.getElementById('mob-div-search');
                const groupByEl = document.getElementById('mob-div-group-by');
                if (!container || !searchEl || !groupByEl) return;

                const searchTerm = searchEl.value.toLowerCase();
                const groupBy = groupByEl.value;

                if (groupBy !== currentGroupBy) {
                    collapsedGroups = new Set();
                    currentGroupBy = groupBy;
                }

                let filtered = rawDivData.filter(d => {
                    return (d.assetTicker || '').toLowerCase().includes(searchTerm) ||
                           (d.portfolioName || '').toLowerCase().includes(searchTerm);
                });

                if (filtered.length === 0) {
                    container.innerHTML = '<div style="text-align:center;padding:48px;opacity:0.5;font-size:13px">Nessun dividendo trovato</div>';
                    return;
                }

                if (groupBy === 'none') {
                    container.innerHTML = `<div class="mob-holdings-list">` + 
                        filtered.sort((a,b) => new Date(b.date) - new Date(a.date))
                        .map(d => renderMobRow(d)).join('') + 
                        `</div>`;
                } else {
                    const groups = {};
                    filtered.forEach(d => {
                        let key = d[groupBy];
                        if (groupBy === 'year') key = d.date.split('-')[0];
                        if (!groups[key]) groups[key] = { items: [], total: 0 };
                        groups[key].items.push(d);
                        groups[key].total += d.amount;
                    });

                    const keys = Object.keys(groups).sort((a, b) => {
                        if (groupBy === 'year') return b - a;
                        return a.localeCompare(b);
                    });

                    container.innerHTML = keys.map(key => {
                        const group = groups[key];
                        const isCollapsed = collapsedGroups.has(key);
                        return `
                            <div class="mob-section-header" style="margin-top:10px; cursor:pointer" onclick="toggleMobGroup('${key}')">
                                <span class="text-[11px] font-black uppercase tracking-widest text-slate-500">${key.toUpperCase()}</span>
                                <div class="flex items-center gap-2">
                                    <span class="text-[11px] font-bold text-emerald-500">${formatCurrency(group.total, 'EUR')}</span>
                                    <span class="material-symbols-outlined text-sm opacity-30 transition-transform ${isCollapsed ? 'rotate-180' : ''}">${isCollapsed ? 'expand_more' : 'expand_less'}</span>
                                </div>
                            </div>
                            <div class="mob-holdings-list" style="${isCollapsed ? 'display:none' : ''}">
                                ${group.items.sort((a,b) => new Date(b.date) - new Date(a.date)).map(d => renderMobRow(d)).join('')}
                            </div>
                        `;
                    }).join('');
                }
            }

            function renderMobRow(d) {
                const letters = d.assetTicker ? d.assetTicker.substring(0, 3).toUpperCase() : '???';
                return `
                    <div class="mob-holding-item">
                        <div class="mob-holding-logo">${letters}</div>
                        <div class="mob-holding-info">
                            <div class="mob-holding-ticker">${d.assetTicker}</div>
                            <div class="mob-holding-name">${d.portfolioName} · ${d.date}</div>
                        </div>
                        <div class="mob-holding-values">
                            <div class="mob-holding-value text-emerald-500" style="font-weight:800">${formatCurrency(d.amount, 'EUR')}</div>
                        </div>
                    </div>
                `;
            }

            document.addEventListener('DOMContentLoaded', loadMobData);
            window.addEventListener('mobile-view-activated', loadMobData);
        })();
    </script>
</body>
</html>
