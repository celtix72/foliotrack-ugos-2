<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>M2T - Notifications</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="M2T">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/dist/output.css">
    <link rel="stylesheet" href="/mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        
        /* Swipe Animation classes */
        .notification-item {
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s;
        }
        .notification-item.removing {
            transform: translateX(-100%) !important;
            opacity: 0;
        }
        
        /* Desktop specific styles for the notification list */
        .desktop-notif-card {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 1rem;
            background-color: #fff;
            border-width: 1px;
            border-color: #e2e8f0;
            border-radius: 1rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }
        .dark .desktop-notif-card {
            background-color: #111722;
            border-color: #1e293b;
        }
        .notif-type-icon {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
    </style>
    <script src="/theme.js"></script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex">
    <!-- Sidebar (Desktop) -->
    <aside class="w-72 border-r border-slate-200 dark:border-slate-800 flex flex-col h-screen sticky top-0 bg-white dark:bg-[#111722] shrink-0">
        <div class="p-6 flex items-center gap-3">
            <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center text-white">
                <span class="material-symbols-outlined">query_stats</span>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight">M2T</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">M2T</p>
            </div>
        </div>
        <nav class="flex-1 px-4 space-y-1 overflow-y-auto custom-scrollbar">
            <div class="pb-4">
                <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" href="/dashboard">
                    <span class="material-symbols-outlined text-[20px]">dashboard</span>
                    <span>Dashboard</span>
                </a>

                <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" href="/market">
                    <span class="material-symbols-outlined text-[20px]">trending_up</span>
                    <span>Market</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" href="/assets">
                    <span class="material-symbols-outlined text-[20px]">currency_exchange</span>
                    <span>Asset</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" href="/reports">
                    <span class="material-symbols-outlined text-[20px]">pie_chart</span>
                    <span>Reports</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" href="/history">
                    <span class="material-symbols-outlined text-[20px]">history</span>
                    <span>History</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" href="/dividend">
                    <span class="material-symbols-outlined text-[20px]">payments</span>
                    <span>Dividend</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" href="/watchlist">
                    <span class="material-symbols-outlined text-[20px]">visibility</span>
                    <span>Watchlist</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" href="/settings">
                    <span class="material-symbols-outlined text-[20px]">settings</span>
                    <span>Settings</span>
                </a>
            </div>
            <div class="pt-4 border-t border-slate-200 dark:border-slate-800">
                <div class="space-y-1" id="sidebar-portfolios"></div>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md flex items-center justify-between px-8 sticky top-0 z-50">
            <div class="flex items-center gap-6">
                <h1 class="text-xl font-black uppercase tracking-widest text-primary">Notifications</h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="clearAllNotifications()" class="text-[10px] font-black uppercase tracking-widest text-rose-500 hover:text-rose-600 transition-colors flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">delete_sweep</span>
                    Clear All
                </button>
                <div class="h-4 w-[1px] bg-slate-200 dark:bg-slate-800"></div>
                <!-- Privacy & Theme same as other pages -->
                <button onclick="togglePrivacy()" class="w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-800 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-primary transition-all shadow-sm">
                    <span class="material-symbols-outlined text-sm">visibility</span>
                </button>
                <button onclick="toggleTheme()" class="w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-800 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-primary transition-all shadow-sm">
                    <span class="material-symbols-outlined text-sm">dark_mode</span>
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 space-y-6" id="desktop-notifications-container">
            <!-- Notifications will be injected here -->
            <div class="flex items-center justify-center h-64 opacity-50">
                <div class="text-center">
                    <span class="material-symbols-outlined text-4xl mb-2">notifications_off</span>
                    <p class="text-sm font-bold uppercase tracking-widest">No notifications found</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile UI Root -->

    <script>
        let notifications = [];

        async function loadNotifications() {
            try {
                const res = await fetch('/api/notifications');
                notifications = await res.json();
                renderNotifications();
            } catch (err) {
                console.error('Error loading notifications:', err);
            }
        }

        function renderNotifications() {
            const desktopContainer = document.getElementById('desktop-notifications-container');
            const mobileContainer = document.getElementById('mob-notifications-list');

            if (notifications.length === 0) {
                const emptyState = `
                    <div class="flex flex-col items-center justify-center opacity-40 py-20">
                        <span class="material-symbols-outlined text-6xl mb-4">notifications_off</span>
                        <p class="font-black uppercase tracking-widest text-sm">Everything is quiet here</p>
                    </div>
                `;
                if (desktopContainer) desktopContainer.innerHTML = emptyState;
                if (mobileContainer) mobileContainer.innerHTML = emptyState;
                return;
            }

            // Render Desktop View
            if (desktopContainer) {
                desktopContainer.innerHTML = notifications.map(n => {
                    const { color, icon, cardBg } = getIconAndColor(n.type);
                    const isTPSL = n.type === 'TARGET_PROFIT' || n.type === 'STOP_LOSS';
                    const ticker = n.ticker || '';
                    const message = n.message || '';
                    const highlightedMessage = ticker ? message.replace(ticker, `<b class="text-blue-500 dark:text-blue-400 font-black">${ticker}</b>`) : message;
                    
                    return `
                        <div class="desktop-notif-card group notification-item ${cardBg || ''}" id="notif-desktop-${n.id}">
                            <div class="flex items-start gap-4">
                                <div class="notif-type-icon ${color}">
                                    <span class="material-symbols-outlined">${icon}</span>
                                </div>
                                <div class="flex-1">
                                    <div class="flex items-center justify-between mb-0.5">
                                        <h3 class="font-black text-[13px] uppercase tracking-tight ${isTPSL ? 'text-slate-900 dark:text-white' : ''}">${n.title}</h3>
                                        <span class="text-[10px] font-bold text-slate-400">${formatDate(n.date)}</span>
                                    </div>
                                    <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium leading-tight">${highlightedMessage}</p>
                                    ${ticker ? `<span class="inline-block mt-1.5 px-1.5 py-0.5 rounded-md bg-blue-500/10 text-[9px] font-black text-blue-600 dark:text-blue-400 border border-blue-500/20">${ticker}</span>` : ''}
                                </div>
                                <button onclick="removeNotification(${n.id})" class="opacity-0 group-hover:opacity-100 transition-opacity p-2 text-slate-300 hover:text-rose-500">
                                    <span class="material-symbols-outlined text-lg">close</span>
                                </button>
                            </div>
                            ${!n.isRead ? '<div class="absolute top-3 right-3 w-2 h-2 rounded-full bg-primary ring-4 ring-white dark:ring-slate-900"></div>' : ''}
                        </div>
                    `;
                }).join('');
            }

            // Render Mobile View
            if (mobileContainer) {
                mobileContainer.innerHTML = notifications.map(n => {
                    const { color, icon, cardBg } = getIconAndColor(n.type);
                    const isTPSL = n.type === 'TARGET_PROFIT' || n.type === 'STOP_LOSS';
                    const ticker = n.ticker || '';
                    const message = n.message || '';
                    const highlightedMessage = ticker ? message.replace(ticker, `<b class="text-blue-500 dark:text-blue-400 font-black">${ticker}</b>`) : message;
                    
                    return `
                        <div class="mob-holding-swipe-container notification-item-wrapper" 
                             ontouchstart="handleTouchStart(event, this)" 
                             ontouchmove="handleTouchMove(event, this)" 
                             ontouchend="handleTouchEnd(event, this)">
                            <div class="mob-holding-actions">
                                <div class="mob-action-btn bg-rose-500" 
                                     ontouchstart="event.stopPropagation()" ontouchend="event.stopPropagation()"
                                     onclick="event.stopPropagation(); removeNotification(${n.id})">
                                    <span class="material-symbols-outlined">delete</span>
                                    <span>Rimuovi</span>
                                </div>
                            </div>
                            <div class="mob-holding-item large notification-item ${cardBg || ''}" id="notif-mob-${n.id}" style="padding: 12px 16px; gap: 10px;">
                                <div class="mob-holding-logo ${color}" style="color:white; background:none; width: 38px; height: 38px;">
                                    <div class="w-8 h-8 rounded-xl flex items-center justify-center ${color}">
                                        <span class="material-symbols-outlined" style="font-size: 18px;">${icon}</span>
                                    </div>
                                </div>
                                <div class="mob-holding-info">
                                    <div class="flex items-center justify-between">
                                        <div class="mob-holding-ticker ${isTPSL ? 'text-slate-900 dark:text-white font-black' : ''}" style="font-size: 14px;">${n.title}</div>
                                        <div class="text-[9px] font-bold text-slate-500">${formatRelativeDate(n.date)}</div>
                                    </div>
                                    <div class="mob-holding-name" style="font-size: 11px; margin-top: -1px;">${highlightedMessage}</div>
                                    ${ticker ? `<div class="mob-holding-qty" style="color:var(--mob-primary); font-weight:900; font-size: 9px; margin-top: 2px;"><span class="text-blue-600 dark:text-blue-400">${ticker}</span></div>` : ''}
                                </div>
                                ${!n.isRead ? '<div class="w-1.5 h-1.5 rounded-full bg-primary absolute right-3 top-1/2 -translate-y-1/2"></div>' : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            markAllAsRead();
        }

        function getIconAndColor(type) {
            switch(type.toUpperCase()) {
                case 'STOP_LOSS': return { icon: 'trending_down', color: 'bg-rose-500 text-white', cardBg: 'bg-rose-500/10 dark:bg-rose-500/5 border-rose-500/20' };
                case 'TARGET_PROFIT': return { icon: 'trending_up', color: 'bg-emerald-500 text-white', cardBg: 'bg-emerald-500/10 dark:bg-emerald-500/5 border-emerald-500/20' };
                case 'DIVIDEND': return { icon: 'payments', color: 'bg-amber-500/10 text-amber-500' };
                case 'ALERT': return { icon: 'warning', color: 'bg-orange-500/10 text-orange-500' };
                default: return { icon: 'notifications', color: 'bg-primary/10 text-primary' };
            }
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function formatRelativeDate(dateStr) {
            const now = new Date();
            const d = new Date(dateStr);
            const diffMs = now - d;
            const diffMins = Math.floor(diffMs / 60000);
            if (diffMins < 1) return 'Adesso';
            if (diffMins < 60) return `${diffMins}m fa`;
            const diffHours = Math.floor(diffMins / 60);
            if (diffHours < 24) return `${diffHours}o fa`;
            return d.toLocaleDateString('it-IT');
        }

        async function removeNotification(id) {
            const desktopEl = document.getElementById(`notif-desktop-${id}`);
            const mobEl = document.getElementById(`notif-mob-${id}`);
            
            if (desktopEl) desktopEl.classList.add('removing');
            if (mobEl) mobEl.classList.add('removing');

            setTimeout(async () => {
                try {
                    await fetch(`/api/notifications/${id}`, { method: 'DELETE' });
                    notifications = notifications.filter(n => n.id !== id);
                    renderNotifications();
                    if (window.updateNotificationBadge) window.updateNotificationBadge();
                } catch (err) {
                    console.error('Delete failed:', err);
                }
            }, 300);
        }

        async function clearAllNotifications() {
            if (!confirm('Sei sicuro di voler rimuovere tutte le notifiche?')) return;
            try {
                await fetch('/api/notifications', { method: 'DELETE' });
                notifications = [];
                renderNotifications();
                if (window.updateNotificationBadge) window.updateNotificationBadge();
            } catch (err) {
                console.error('Clear all failed:', err);
            }
        }

        async function markAllAsRead() {
            try {
                await fetch('/api/notifications/read-all', { method: 'POST' });
                if (window.updateNotificationBadge) window.updateNotificationBadge();
            } catch (err) {}
        }

        // --- Swipe Logic (Mobile) ---
        let touchStartX = 0;
        let touchMoveX = 0;
        let currentSwipeEl = null;
        const SWIPE_THRESHOLD = 50;
        const ACTION_WIDTH = 80;

        window.handleTouchStart = function(e, container) {
            touchStartX = e.touches[0].clientX;
            touchMoveX = 0;
            if (currentSwipeEl && currentSwipeEl !== container) {
                resetSwipes(container);
            }
        };

        window.handleTouchMove = function(e, container) {
            const item = container.querySelector('.notification-item');
            if (!item) return;
            touchMoveX = e.touches[0].clientX;
            let diff = touchMoveX - touchStartX;
            if (diff > 0) diff = 0;
            if (diff < -ACTION_WIDTH - 10) diff = -ACTION_WIDTH - 10;
            item.style.transition = 'none';
            item.style.transform = `translateX(${diff}px)`;
        };

        window.handleTouchEnd = function(e, container) {
            const item = container.querySelector('.notification-item');
            if (!item) return;
            const diff = touchMoveX - touchStartX;
            
            item.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
            
            // If movement occurred and was beyond threshold, keep actions open.
            // Otherwise (including simple tap), reset to 0. (Tap-to-close)
            if (touchMoveX !== 0 && diff < -SWIPE_THRESHOLD) {
                item.style.transform = `translateX(-${ACTION_WIDTH}px)`;
                currentSwipeEl = container;
            } else {
                item.style.transform = 'translateX(0)';
                currentSwipeEl = null;
            }
        };

        function resetSwipes(except) {
            document.querySelectorAll('.notification-item-wrapper').forEach(c => {
                if (c === except) return;
                const item = c.querySelector('.notification-item');
                if (item) item.style.transform = 'translateX(0)';
            });
            currentSwipeEl = null;
        }

        document.addEventListener('DOMContentLoaded', loadNotifications);
    </script>
</body>
</html>
</body></html>
