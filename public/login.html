<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>M2T - Login</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/dist/output.css">
    <link rel="stylesheet" href="/mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="/theme.js"></script>
    <style>
        .login-bg {
            background: radial-gradient(circle at 10% 20%, rgba(19, 91, 236, 0.15) 0%, transparent 20%),
                        radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 20%);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-[#0b0f1a] text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 login-bg transition-colors duration-300">
    
    <div class="w-full max-w-md">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary mx-auto rounded-2xl flex items-center justify-center text-white mb-4 shadow-lg shadow-primary/30">
                <span class="material-symbols-outlined text-3xl">query_stats</span>
            </div>
            <h1 class="text-3xl font-black tracking-tight mb-2">M2T <span class="text-primary tracking-tighter">Tracker</span></h1>
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Sign in to your portfolio</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white dark:bg-[#111722] rounded-3xl p-8 shadow-2xl shadow-slate-200/50 dark:shadow-black/50 border border-slate-200 dark:border-slate-800">
            <form id="login-form" class="space-y-6">
                <!-- Username -->
                <div class="space-y-2">
                    <label class="text-[11px] font-black uppercase tracking-widest text-slate-500 flex items-center gap-2">
                        <span class="material-symbols-outlined text-[14px]">person</span> Username
                    </label>
                    <input type="text" id="username" required autocomplete="username"
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"
                        placeholder="Enter your username">
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <label class="text-[11px] font-black uppercase tracking-widest text-slate-500 flex items-center gap-2">
                        <span class="material-symbols-outlined text-[14px]">lock</span> Password
                    </label>
                    <input type="password" id="password" required autocomplete="current-password"
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"
                        placeholder="Enter your password">
                </div>

                <!-- Error Message -->
                <div id="error-msg" class="hidden rounded-lg bg-rose-500/10 border border-rose-500/20 px-4 py-3 text-xs font-bold text-rose-500 flex items-center gap-2">
                    <span class="material-symbols-outlined text-[16px]">error</span>
                    <span id="error-text">Credenziali non valide.</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn"
                    class="w-full bg-primary hover:bg-primary/90 text-white rounded-xl py-3.5 text-sm font-bold uppercase tracking-widest transition-all hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2 relative">
                    <span id="btn-text">Accedi</span>
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
            </form>
        </div>
        
        <div class="mt-8 text-center">
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-white dark:bg-[#111722] border border-slate-200 dark:border-slate-800 text-slate-500 hover:text-primary transition-colors flex items-center justify-center mx-auto shadow-sm">
                <span class="material-symbols-outlined text-[18px]" id="auth-theme-icon">dark_mode</span>
            </button>
        </div>
    </div>

    <script>
        // Update theme icon explicitly for auth page logic
        function updateAuthThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('auth-theme-icon');
            if (icon) icon.textContent = isDark ? 'light_mode' : 'dark_mode';
        }
        
        // Listen to native theme logic via mutation observer on HTML
        new MutationObserver(updateAuthThemeIcon).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
        updateAuthThemeIcon();

        // Login Logic
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnText = document.getElementById('btn-text');
            const submitBtn = document.getElementById('submit-btn');
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            btnText.textContent = 'Verificando...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80');
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    errorText.textContent = data.error || 'Errore di connessione.';
                    errorMsg.classList.remove('hidden');
                    btnText.textContent = 'Accedi';
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-80');
                    return;
                }

                // Success
                btnText.textContent = 'Successo, reindirizzamento...';
                submitBtn.classList.replace('bg-primary', 'bg-emerald-500');
                submitBtn.classList.replace('hover:bg-primary/90', 'hover:bg-emerald-600');
                setTimeout(() => window.location.href = '/dashboard', 300);
                
            } catch (err) {
                errorText.textContent = 'Errore di connessione al server.';
                errorMsg.classList.remove('hidden');
                btnText.textContent = 'Accedi';
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80');
            }
        });
    </script>
</body>
</html>
