<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FolioTrack - Settings</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FolioTrack">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/dist/output.css">
<link rel="stylesheet" href="/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
    </style>
    <script src="/theme.js"></script>
</head>
<body class="bg-background-light dark:bg-[#0b0f1a] text-slate-900 dark:text-slate-100 min-h-screen flex mobile-view-active">
<div id="mobile-ui">
  <!-- ── Mobile Header ── -->
  <div class="mob-header">
    <div class="mob-header-logo-container">
      <div class="mob-header-logo-circle">
        <span class="material-symbols-outlined">insights</span>
      </div>
      <div class="mob-header-logo-text">FolioTrack</div>
    </div>
    
    <div style="flex:1"></div>

    <div class="mob-header-market-pill">
      <div class="mob-market-item">
        <span>EU</span>
        <span id="mob-dot-eu" class="mob-market-dot"></span>
      </div>
      <div class="mob-market-item">
        <span>US</span>
        <span id="mob-dot-us" class="mob-market-dot"></span>
      </div>
    </div>
    
    <div class="mob-header-actions">
      <a href="/notifications" class="mob-icon-btn relative">
        <span class="material-symbols-outlined">notifications</span>
        <span id="mob-notification-badge" class="mob-badge" style="display: none;">0</span>
      </a>
      <div class="mob-icon-btn" onclick="toggleMobileView()">
        <span class="material-symbols-outlined">desktop_windows</span>
      </div>
    </div>
  </div>

  <!-- ── Mobile Scrollable Content ── -->
  <div class="mob-scroll" id="mob-settings-scroll">
      <!-- Profile Area -->
      <div class="mob-settings-group">
          <div class="mob-settings-group-title">Account</div>
          <div class="mob-settings-card p-5 flex items-center gap-4">
              <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                  <span class="material-symbols-outlined text-2xl">person</span>
              </div>
              <div class="flex-1">
                  <h3 class="font-black text-base">User</h3>
                  <p class="text-xs text-slate-500">user@foliotrack.io</p>
              </div>
          </div>
      </div>

      <!-- Settings Cards -->
      <div class="mob-settings-group">
          <div class="mob-settings-group-title">Options</div>
          <div class="mob-settings-card">
              <div class="mob-settings-row" onclick="document.getElementById('mob-theme-toggle').click()">
                  <div class="mob-settings-icon bg-gray-500"><span class="material-symbols-outlined">dark_mode</span></div>
                  <div class="mob-settings-label">Dark Mode</div>
                  <div class="mob-toggle">
                      <input type="checkbox" id="mob-theme-toggle" onclick="event.stopPropagation()">
                      <div class="mob-toggle-slider"></div>
                  </div>
              </div>
              <div class="mob-settings-row" onclick="document.getElementById('mob-privacy-toggle').click()">
                  <div class="mob-settings-icon bg-purple-500"><span class="material-symbols-outlined">visibility_off</span></div>
                  <div class="mob-settings-label">Privacy Mode</div>
                  <div class="mob-toggle">
                      <input type="checkbox" id="mob-privacy-toggle" onclick="event.stopPropagation()">
                      <div class="mob-toggle-slider"></div>
                  </div>
              </div>
          </div>
      </div>

      <!-- Actions -->
      <div class="mob-settings-group mt-8">
          <div class="mob-settings-card">
              <button onclick="confirmReset()" class="mob-settings-row w-full text-left">
                  <div class="mob-settings-icon bg-rose-500"><span class="material-symbols-outlined text-white">delete_forever</span></div>
                  <div class="mob-settings-label text-rose-500 font-bold">Wipe Database</div>
                  <span class="material-symbols-outlined text-rose-500">chevron_right</span>
              </button>
          </div>
      </div>

      <div class="h-32"></div>
  </div>

  <!-- ── Mobile Tab Bar ── -->
  <div class="mob-tab-bar">
    <a href="/dashboard" class="mob-tab-item">
      <span class="material-symbols-outlined">dashboard</span>
    </a>
    <a href="/market" class="mob-tab-item">
      <span class="material-symbols-outlined">trending_up</span>
    </a>
    <a href="/history" class="mob-tab-item">
      <span class="material-symbols-outlined">history</span>
    </a>
    <a href="/reports" class="mob-tab-item">
      <span class="material-symbols-outlined">pie_chart</span>
    </a>
  </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const themeToggle = document.getElementById('mob-theme-toggle');
        const privacyToggle = document.getElementById('mob-privacy-toggle');

        const updateUI = (settings) => {
            if (themeToggle) themeToggle.checked = settings.theme === 'dark';
            if (privacyToggle) privacyToggle.checked = settings.privacyMode === 'true';
        };

        window.addEventListener('settings-updated', (e) => updateUI(e.detail));

        if (themeToggle) themeToggle.addEventListener('change', () => {
            if (window.updateAppSettings) window.updateAppSettings({ theme: themeToggle.checked ? 'dark' : 'light' });
        });
        if (privacyToggle) privacyToggle.addEventListener('change', () => {
            if (window.updateAppSettings) window.updateAppSettings({ privacyMode: String(privacyToggle.checked) });
        });

        fetch('/api/settings').then(res => res.json()).then(updateUI);
    });

    function confirmReset() {
        if (confirm('Permanently delete all data?')) {
            fetch('/api/reset-data', { method: 'POST' }).then(() => window.location.href = '/dashboard');
        }
    }
</script>
</body>
</html>
